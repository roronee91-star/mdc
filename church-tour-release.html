<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리교회 가상 성전 투어 (지하 본당 내부 완벽 진입 모드)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      background-color: #111827;
      color: #fff;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px 22px;
    }
    .header-box {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(14px);
      padding: 12px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: inline-flex;
      align-items: center;
      gap: 16px;
      max-width: fit-content;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .header-title {
      font-size: 15px;
      font-weight: 700;
    }
    .header-desc {
      font-size: 12px;
      color: #94a3b8;
    }
    .floor-controls {
      display: flex;
      gap: 8px;
    }
    .nav-btn {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.22);
    }
    .nav-btn.active {
      background: #2563eb;
      border-color: #60a5fa;
      box-shadow: 0 0 14px rgba(37, 99, 235, 0.6);
    }
    .bottom-panel {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      width: 100%;
    }
    .guide-box {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(14px);
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 12px;
      line-height: 1.6;
      color: #cbd5e1;
      max-width: 480px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .guide-box b {
      color: #38bdf8;
    }
    .action-panel {
      pointer-events: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }
    .action-btn {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(10px);
      transition: all 0.2s;
    }
    .action-btn:hover {
      background: #3b82f6;
      border-color: #60a5fa;
      transform: translateY(-2px);
    }
    #loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity 0.5s ease;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #loading-text {
      font-size: 15px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 8px;
    }
    #loading-sub {
      font-size: 12px;
      color: #64748b;
    }
    #click-marker {
      position: absolute;
      width: 24px;
      height: 24px;
      border: 2px solid #38bdf8;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      transition: transform 0.2s ease-out, opacity 0.3s ease-out;
    }
  </style>

  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.js"}}</script>
</head>
<body>

  <div id="loading-screen">
    <div class="spinner"></div>
    <div id="loading-text">가상 성전 공간을 불러오는 중입니다...</div>
    <div id="loading-sub">본당 내부 및 시야 확보 처리 중</div>
  </div>

  <div id="canvas-container"></div>
  <div id="click-marker"></div>

  <div id="ui-overlay">
    <div class="header-box">
      <div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span class="header-title">우리교회 메타버스 성전 투어</span>
        </div>
        <div class="header-desc">지하 1층 대본당 내부가 시원하게 열려 있습니다.</div>
      </div>
      <div class="floor-controls">
        <button class="nav-btn" id="btnGoGround">🏢 1층 광장/외관</button>
        <button class="nav-btn active" id="btnGoBasement">⛪ 지하 1층 본당 내부</button>
      </div>
      <button class="nav-btn" id="bgmToggle">
        <span>🎵 잔잔한 찬양</span>
      </button>
    </div>

    <div class="bottom-panel">
      <div class="guide-box">
        <b>[조작 안내]</b><br>
        • <b>바닥 클릭:</b> 본당 안 통로나 원하는 자리를 찍으면 걸어갑니다.<br>
        • <b>화면 드래그:</b> 마우스 좌클릭 드래그로 시선 360도 회전, 우클릭 드래그로 이동<br>
        • <b>천장 뚫기(단면 뷰):</b> 지하에 있을 때 지상 건물과 천장이 투명해져 실내가 훤히 보입니다.
      </div>

      <div class="action-panel">
        <button class="action-btn" id="btnInsideAisle">🚶 본당 중앙 통로로</button>
        <button class="action-btn" id="btnPewSit">🪑 장의자 착석</button>
        <button class="action-btn" id="btnPray">🙏 자리에서 기도</button>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import {GLTFLoader} from './vendor/three/loaders/GLTFLoader.js';
    import {OrbitControls} from './vendor/three/controls/OrbitControls.js';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xdce7f3);
    scene.fog = new THREE.FogExp2(0xdce7f3, 0.002);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 1.0;
    controls.maxDistance = 65;
    controls.mouseButtons = {
      LEFT: THREE.MOUSE.ROTATE,
      MIDDLE: THREE.MOUSE.DOLLY,
      RIGHT: THREE.MOUSE.PAN
    };

    // 조명
    const hemiLight = new THREE.HemisphereLight(0xfff6ec, 0x475569, 0.95);
    hemiLight.position.set(0, 50, 0);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfff3e0, 1.3);
    sunLight.position.set(20, 35, 25);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.bias = -0.0004;
    scene.add(sunLight);

    // 본당 내부용 따뜻한 실내 조명
    const b1WarmLight1 = new THREE.PointLight(0xffe2b8, 2.2, 35, 0.7);
    b1WarmLight1.position.set(-6, -4.5, 6);
    scene.add(b1WarmLight1);

    const b1WarmLight2 = new THREE.PointLight(0xffecd0, 2.0, 35, 0.7);
    b1WarmLight2.position.set(-10, -4.5, 12);
    scene.add(b1WarmLight2);

    // 지면
    const terrain = new THREE.Mesh(
      new THREE.PlaneGeometry(300, 300),
      new THREE.MeshStandardMaterial({ color: 0xc3ccc0, roughness: 1.0 })
    );
    terrain.rotation.x = -Math.PI / 2;
    terrain.position.y = -0.28;
    terrain.receiveShadow = true;
    scene.add(terrain);

    // 클릭 링 마커
    const markerGeo = new THREE.RingGeometry(0.15, 0.45, 32);
    const markerMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide, transparent: true, opacity: 0 });
    const targetRing = new THREE.Mesh(markerGeo, markerMat);
    targetRing.rotation.x = -Math.PI / 2;
    targetRing.position.y = -6.58;
    scene.add(targetRing);

    // 캐릭터 (1m 2등신 아바타)
    const characterGroup = new THREE.Group();
    const bodyGeo = new THREE.CylinderGeometry(0.24, 0.32, 0.55, 16);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.5 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.38;
    body.castShadow = true;
    characterGroup.add(body);

    const headGeo = new THREE.SphereGeometry(0.30, 20, 20);
    const headMat = new THREE.MeshStandardMaterial({ color: 0xffedd5, roughness: 0.7 });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 0.85;
    head.castShadow = true;
    characterGroup.add(head);

    const handsGeo = new THREE.SphereGeometry(0.10, 12, 12);
    const handMat = new THREE.MeshStandardMaterial({ color: 0xffedd5 });
    const hands = new THREE.Mesh(handsGeo, handMat);
    hands.position.set(0, 0.48, 0.22);
    hands.scale.set(1.4, 0.9, 0.9);
    hands.visible = false;
    characterGroup.add(hands);

    const B1_FLOOR_Y = -6.6;
    const G_FLOOR_Y = 0.0;
    let currentFloor = 'B1';

    // 본당 내부 중앙 통로 좌표로 스폰 (벽 바깥이 아닌 내부!)
    // Blender 좌표 (-6.0, 8.0) 부근이 회중석 한가운데입니다.
    characterGroup.position.set(-6.0, B1_FLOOR_Y, 7.5);
    scene.add(characterGroup);

    let loadedModel = null;
    const clickableObjects = [terrain];
    const upperRoofsAndCeilings = [];
    const obstructingWalls = [];

    const loader = new GLTFLoader();
    const loadingScreen = document.getElementById('loading-screen');
    const loadingSub = document.getElementById('loading-sub');

    loader.load(
      'church-model-release-20261104.glb',
      (gltf) => {
        loadedModel = gltf.scene;

        loadedModel.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            clickableObjects.push(child);

            // 유리창 투명화
            if (child.name.includes('GLASS') || child.name.includes('Glass')) {
              child.material.transparent = true;
              child.material.opacity = 0.40;
              child.material.roughness = 0.1;
              child.material.depthWrite = false;
            }

            // 천장 및 지상 바닥 슬래브 감지 (지하 내부를 볼 때 시야를 막는 요소들)
            if (
              child.name.includes('Ceiling') || 
              child.name.includes('ROOF') || 
              child.name.includes('F1_PARKING') ||
              child.name.includes('SLAB')
            ) {
              upperRoofsAndCeilings.push(child);
            }

            // 본당 남측/동측 외벽 (카메라 시야 가림 방지)
            if (child.name.includes('Wall_South') || child.name.includes('Wall_East')) {
              obstructingWalls.push(child);
            }
          }
        });

        loadedModel.position.set(0, 0, 0);
        scene.add(loadedModel);

        // 로드 완료 시 즉시 지하 본당 내부 최적화 뷰 적용
        applyFloorMode('B1');

        loadingScreen.style.opacity = '0';
        setTimeout(() => loadingScreen.style.display = 'none', 400);
      },
      (xhr) => {
        if (xhr.lengthComputable) {
          const percent = Math.round((xhr.loaded / xhr.total) * 100);
          loadingSub.innerText = `모델 데이터 로딩 중... (${percent}%)`;
        }
      },
      (err) => {
        console.warn('GLB 대기 중 (기본 씬 유지):', err);
        loadingScreen.style.opacity = '0';
        setTimeout(() => loadingScreen.style.display = 'none', 300);
        applyFloorMode('B1');
      }
    );

    // -------------------------------------------------------------
    // 지하 1층 내부 가림막(천장/남측벽) 투명/오픈 처리 로직
    // -------------------------------------------------------------
    function applyFloorMode(floor) {
      currentFloor = floor;
      if (floor === 'B1') {
        // 지하 모드: 천장과 위쪽 덮개를 숨겨 본당 안이 시원하게 보이게 함
        upperRoofsAndCeilings.forEach(mesh => {
          mesh.visible = false;
        });
        obstructingWalls.forEach(mesh => {
          mesh.material.transparent = true;
          mesh.material.opacity = 0.25;
        });
        terrain.visible = false;

        // 캐릭터를 본당 중앙 통로 안으로 정확히 안착
        characterGroup.position.set(-6.0, B1_FLOOR_Y, 7.5);
        // 강단 모서리를 올려다보도록 시선 회전 (-45도)
        characterGroup.rotation.y = Math.PI * 0.75;

        // 카메라도 본당 안으로 진입
        camera.position.set(-2.5, B1_FLOOR_Y + 2.5, 3.5);
        controls.target.set(-6.0, B1_FLOOR_Y + 0.85, 7.5);
      } else {
        // 지상 외관 모드: 천장과 지면 다시 표시
        upperRoofsAndCeilings.forEach(mesh => {
          mesh.visible = true;
        });
        obstructingWalls.forEach(mesh => {
          mesh.material.transparent = false;
          mesh.material.opacity = 1.0;
        });
        terrain.visible = true;

        characterGroup.position.set(0, G_FLOOR_Y, 9.0);
        characterGroup.rotation.y = 0;
        camera.position.set(16, 10, 20);
        controls.target.set(0, 0.85, 9.0);
      }
    }

    // 클릭 투 무브
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let isMoving = false;
    const targetPos = new THREE.Vector3().copy(characterGroup.position);
    let targetMarkerTimer = 0;
    let isSitting = false;
    let isPraying = false;
    let downTime = 0;
    let downPos = { x: 0, y: 0 };

    window.addEventListener('pointerdown', (e) => {
      downTime = performance.now();
      downPos.x = e.clientX;
      downPos.y = e.clientY;
    });

    window.addEventListener('pointerup', (e) => {
      const diffTime = performance.now() - downTime;
      const dist = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
      if (diffTime > 260 || dist > 6) return;
      if (e.target.closest('#ui-overlay')) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(clickableObjects, true);

      if (intersects.length > 0) {
        let hit = null;
        for (let i = 0; i < intersects.length; i++) {
          const p = intersects[i].point;
          // 벽이나 높은 천장이 아닌 실제 바닥 근처 높이 필터링
          if (currentFloor === 'B1') {
            if (p.y <= -5.0 && p.y >= -7.0) { hit = p; break; }
          } else {
            if (p.y >= -0.5 && p.y <= 1.0) { hit = p; break; }
          }
        }
        if (!hit) {
          // 바닥 필터 실패 시 Y값 강제 보정
          hit = intersects[0].point.clone();
          hit.y = (currentFloor === 'B1' ? B1_FLOOR_Y : G_FLOOR_Y);
        }

        targetPos.set(hit.x, (currentFloor === 'B1' ? B1_FLOOR_Y : G_FLOOR_Y), hit.z);
        isMoving = true;
        isSitting = false;
        isPraying = false;
        hands.visible = false;

        targetRing.position.set(hit.x, targetPos.y + 0.03, hit.z);
        targetRing.scale.set(0.1, 0.1, 0.1);
        targetRing.material.opacity = 0.9;
        targetMarkerTimer = 1.0;
      }
    });

    // 층 전환 버튼
    const btnGoGround = document.getElementById('btnGoGround');
    const btnGoBasement = document.getElementById('btnGoBasement');

    btnGoGround.addEventListener('click', () => {
      btnGoGround.classList.add('active');
      btnGoBasement.classList.remove('active');
      applyFloorMode('G');
    });

    btnGoBasement.addEventListener('click', () => {
      btnGoBasement.classList.add('active');
      btnGoGround.classList.remove('active');
      applyFloorMode('B1');
    });

    // 인터랙션 버튼
    document.getElementById('btnInsideAisle').addEventListener('click', () => {
      if (currentFloor !== 'B1') {
        btnGoBasement.classList.add('active');
        btnGoGround.classList.remove('active');
        applyFloorMode('B1');
      }
      characterGroup.position.set(-6.0, B1_FLOOR_Y, 7.5);
      targetPos.copy(characterGroup.position);
      controls.target.set(-6.0, B1_FLOOR_Y + 0.85, 7.5);
      camera.position.set(-2.5, B1_FLOOR_Y + 2.5, 3.5);
    });

    document.getElementById('btnPewSit').addEventListener('click', () => {
      if (currentFloor !== 'B1') {
        btnGoBasement.classList.add('active');
        btnGoGround.classList.remove('active');
        applyFloorMode('B1');
      }
      isMoving = false;
      isSitting = true;
      isPraying = true;
      hands.visible = true;
      // 중앙 회중석 안으로 쏙 앉히기
      characterGroup.position.set(-5.5, B1_FLOOR_Y - 0.15, 9.2);
      characterGroup.rotation.y = Math.PI * 0.75;
      targetPos.copy(characterGroup.position);
      controls.target.copy(characterGroup.position).add(new THREE.Vector3(0, 0.85, 0));
    });

    const btnPray = document.getElementById('btnPray');
    btnPray.addEventListener('click', () => {
      isMoving = false;
      isPraying = !isPraying;
      hands.visible = isPraying;
      if (isPraying) {
        btnPray.innerHTML = '✨ 묵상 중 (일어서기)';
        btnPray.style.background = '#0284c7';
      } else {
        btnPray.innerHTML = '🙏 자리에서 기도';
        btnPray.style.background = 'rgba(30, 41, 59, 0.9)';
      }
    });

    // BGM
    let audioCtx = null;
    let isBgmPlaying = false;
    let audioTimer = null;
    const chords = [[261.63, 329.63, 392.00], [220.00, 261.63, 329.63], [174.61, 220.00, 261.63], [196.00, 246.94, 293.66]];
    let chordIdx = 0;

    function playCalmChord() {
      if (!isBgmPlaying || !audioCtx) return;
      const currentChord = chords[chordIdx % chords.length];
      chordIdx++;
      currentChord.forEach(freq => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.035, audioCtx.currentTime + 1.6);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 5.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 5.6);
      });
      audioTimer = setTimeout(playCalmChord, 4600);
    }

    document.getElementById('bgmToggle').addEventListener('click', () => {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      isBgmPlaying = !isBgmPlaying;
      const btn = document.getElementById('bgmToggle');
      if (isBgmPlaying) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        btn.innerHTML = '<span>🔊 찬양 반주 중 (정지)</span>';
        btn.style.background = '#2563eb';
        playCalmChord();
      } else {
        btn.innerHTML = '<span>🎵 잔잔한 찬양</span>';
        btn.style.background = 'rgba(255,255,255,0.1)';
        clearTimeout(audioTimer);
      }
    });

    // 메인 루프
    const walkSpeed = 3.6;
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (targetMarkerTimer > 0) {
        targetMarkerTimer -= delta * 1.8;
        const scaleVal = 1.0 + (1.0 - targetMarkerTimer) * 0.8;
        targetRing.scale.set(scaleVal, scaleVal, scaleVal);
        targetRing.material.opacity = Math.max(0, targetMarkerTimer);
      }

      if (isMoving) {
        const currentPos = characterGroup.position;
        const dir = new THREE.Vector3().subVectors(targetPos, currentPos);
        dir.y = 0;
        const dist = dir.length();

        if (dist > 0.12) {
          dir.normalize();
          currentPos.addScaledVector(dir, Math.min(dist, walkSpeed * delta));
          const targetRot = Math.atan2(dir.x, dir.z);
          characterGroup.rotation.y = THREE.MathUtils.lerp(characterGroup.rotation.y, targetRot, 0.18);

          const t = clock.getElapsedTime() * 14;
          body.position.y = 0.38 + Math.abs(Math.sin(t)) * 0.05;
          head.position.y = 0.85 + Math.abs(Math.sin(t)) * 0.05;
          characterGroup.rotation.z = Math.sin(t) * 0.05;

          controls.target.lerp(new THREE.Vector3(currentPos.x, currentPos.y + 0.85, currentPos.z), 0.08);
        } else {
          isMoving = false;
          body.position.y = 0.38;
          head.position.y = 0.85;
          characterGroup.rotation.z = 0;
        }
      } else if (isPraying) {
        const breathe = Math.sin(clock.getElapsedTime() * 2.0) * 0.02;
        body.position.y = (isSitting ? 0.22 : 0.38) + breathe;
        head.position.y = (isSitting ? 0.65 : 0.85) + breathe * 0.5;
        head.rotation.x = 0.25;
      } else {
        body.position.y = 0.38;
        head.position.y = 0.85;
        head.rotation.x = 0;
        characterGroup.rotation.z = 0;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
