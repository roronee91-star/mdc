<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리교회 메타버스 성전 투어 (Walkthrough Tour)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #fff;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 20px;
    }
    .header-bar {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(14px);
      padding: 12px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
    }
    .header-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .header-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .header-sub {
      font-size: 11px;
      color: #94a3b8;
    }
    /* 투어 코스 단계별 탭 */
    .tour-steps {
      display: flex;
      gap: 6px;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: 10px;
    }
    .step-btn {
      background: transparent;
      border: none;
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }
    .step-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }
    .step-btn.active {
      background: #2563eb;
      color: #fff;
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.5);
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .bgm-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }
    .bgm-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .bottom-bar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      width: 100%;
    }
    .guide-card {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(14px);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 12px;
      line-height: 1.6;
      color: #cbd5e1;
      max-width: 440px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .guide-card b {
      color: #38bdf8;
    }
    .action-group {
      pointer-events: auto;
      display: flex;
      gap: 8px;
    }
    .action-btn {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 9px 15px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(10px);
      transition: all 0.2s;
    }
    .action-btn:hover {
      background: #3b82f6;
      border-color: #60a5fa;
      transform: translateY(-2px);
    }
    #loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity 0.5s ease;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #loading-text {
      font-size: 15px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 6px;
    }
    #loading-sub {
      font-size: 12px;
      color: #64748b;
    }
    #click-marker {
      position: absolute;
      width: 24px;
      height: 24px;
      border: 2px solid #38bdf8;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      transition: transform 0.2s ease-out, opacity 0.3s ease-out;
    }
  </style>

  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.js"}}</script>
</head>
<body>

  <div id="loading-screen">
    <div class="spinner"></div>
    <div id="loading-text">가상 성전 공간을 준비 중입니다...</div>
    <div id="loading-sub">교회 외관 및 본당 환경 구성 중</div>
  </div>

  <div id="canvas-container"></div>
  <div id="click-marker"></div>

  <div id="ui-overlay">
    <div class="header-bar">
      <div class="header-left">
        <span class="header-title">우리교회 메타버스 성전 투어</span>
        <span class="header-sub" id="currentAreaText">현재 위치: 외관 횡단보도 (출발점)</span>
      </div>

      <div class="tour-steps">
        <button class="step-btn active" id="step1">1. 횡단보도</button>
        <button class="step-btn" id="step2">2. 교회 앞 광장</button>
        <button class="step-btn" id="step3">3. 1층 로비·계단</button>
        <button class="step-btn" id="step4">4. 지하 본당 입구</button>
      </div>

      <div class="header-right">
        <button class="bgm-btn" id="bgmToggle">
          <span>🎵 잔잔한 찬양</span>
        </button>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="guide-card">
        <b>[조작 안내]</b><br>
        • <b>바닥 클릭/터치:</b> 원하는 곳을 콕 찍으면 캐릭터가 그곳으로 걸어갑니다.<br>
        • <b>화면 드래그:</b> 마우스 좌클릭 드래그로 주변 360도 둘러보기, 우클릭으로 시점 이동<br>
        • <b>상단 투어 코스:</b> 횡단보도에서 시작해 로비, 지하 본당까지 순서대로 탐방해보세요!
      </div>

      <div class="action-group">
        <button class="action-btn" id="btnActionPew">🪑 장의자 착석</button>
        <button class="action-btn" id="btnActionPray">🙏 자리에서 기도</button>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import {GLTFLoader} from './vendor/three/loaders/GLTFLoader.js';
    import {OrbitControls} from './vendor/three/controls/OrbitControls.js';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xdce7f3);
    scene.fog = new THREE.FogExp2(0xdce7f3, 0.002);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 1.2;
    controls.maxDistance = 55;
    controls.mouseButtons = {
      LEFT: THREE.MOUSE.ROTATE,
      MIDDLE: THREE.MOUSE.DOLLY,
      RIGHT: THREE.MOUSE.PAN
    };

    // 조명 (야외 태양광 + 지하 실내광)
    const hemiLight = new THREE.HemisphereLight(0xfff6ec, 0x475569, 0.95);
    hemiLight.position.set(0, 50, 0);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfff3e0, 1.4);
    sunLight.position.set(20, 35, 25);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.bias = -0.0004;
    scene.add(sunLight);

    // 지하 본당 실내 전용 앰비언트 라이트
    const b1WarmLight = new THREE.PointLight(0xffe3be, 2.4, 30, 0.8);
    b1WarmLight.position.set(-6, -4.0, -8);
    scene.add(b1WarmLight);

    // 야외 지면 베이스
    const terrain = new THREE.Mesh(
      new THREE.PlaneGeometry(300, 300),
      new THREE.MeshStandardMaterial({ color: 0xc3ccc0, roughness: 1.0 })
    );
    terrain.rotation.x = -Math.PI / 2;
    terrain.position.y = -0.28;
    terrain.receiveShadow = true;
    scene.add(terrain);

    // 클릭 타겟 링 마커
    const markerGeo = new THREE.RingGeometry(0.15, 0.45, 32);
    const markerMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide, transparent: true, opacity: 0 });
    const targetRing = new THREE.Mesh(markerGeo, markerMat);
    targetRing.rotation.x = -Math.PI / 2;
    targetRing.position.y = 0.02;
    scene.add(targetRing);

    // 1m 아바타 캐릭터
    const characterGroup = new THREE.Group();
    const bodyGeo = new THREE.CylinderGeometry(0.24, 0.32, 0.55, 16);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.5 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.38;
    body.castShadow = true;
    characterGroup.add(body);

    const headGeo = new THREE.SphereGeometry(0.30, 20, 20);
    const headMat = new THREE.MeshStandardMaterial({ color: 0xffedd5, roughness: 0.7 });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 0.85;
    head.castShadow = true;
    characterGroup.add(head);

    const handsGeo = new THREE.SphereGeometry(0.10, 12, 12);
    const handMat = new THREE.MeshStandardMaterial({ color: 0xffedd5 });
    const hands = new THREE.Mesh(handsGeo, handMat);
    hands.position.set(0, 0.48, 0.22);
    hands.scale.set(1.4, 0.9, 0.9);
    hands.visible = false;
    characterGroup.add(hands);

    // 시작 지점: 외관 횡단보도 (CROSSWALK)
    const START_POS = new THREE.Vector3(-1.5, 0.0, 7.5);
    characterGroup.position.copy(START_POS);
    characterGroup.rotation.y = Math.PI;
    scene.add(characterGroup);

    camera.position.set(-1.5 + 4, 3.5, 7.5 + 6.5);
    controls.target.set(-1.5, 1.0, 7.5);

    let loadedModel = null;
    const clickableObjects = [terrain];
    const loader = new GLTFLoader();
    const loadingScreen = document.getElementById('loading-screen');
    const loadingSub = document.getElementById('loading-sub');

    loader.load(
      'church-model-release-20261104.glb',
      (gltf) => {
        loadedModel = gltf.scene;
        loadedModel.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            clickableObjects.push(child);
            if (child.name.includes('GLASS') || child.name.includes('Glass')) {
              child.material.transparent = true;
              child.material.opacity = 0.40;
              child.material.roughness = 0.1;
              child.material.depthWrite = false;
            }
          }
        });
        loadedModel.position.set(0, 0, 0);
        scene.add(loadedModel);
        loadingScreen.style.opacity = '0';
        setTimeout(() => loadingScreen.style.display = 'none', 400);
      },
      (xhr) => {
        if (xhr.lengthComputable) {
          const percent = Math.round((xhr.loaded / xhr.total) * 100);
          loadingSub.innerText = `모델 데이터 로딩 중... (${percent}%)`;
        }
      },
      (err) => {
        console.warn('GLB 모델 대기 중:', err);
        loadingScreen.style.opacity = '0';
        setTimeout(() => loadingScreen.style.display = 'none', 300);
      }
    );

    // =========================================================================
    // 투어 단계별 정의
    // =========================================================================
    const TOUR_WAYPOINTS = {
      step1: {
        name: '외관 횡단보도 (출발점)',
        charPos: new THREE.Vector3(-1.5, 0.0, 7.5),
        charRot: Math.PI,
        camOffset: new THREE.Vector3(3.5, 3.2, 6.0),
        floorY: 0.0,
        isB1: false
      },
      step2: {
        name: '교회 앞 보도 및 광장',
        charPos: new THREE.Vector3(-1.5, 0.0, 1.8),
        charRot: Math.PI,
        camOffset: new THREE.Vector3(4.0, 3.5, 5.0),
        floorY: 0.0,
        isB1: false
      },
      step3: {
        name: '1층 로비 및 계단실 입구',
        charPos: new THREE.Vector3(-3.0, 0.0, -2.5),
        charRot: Math.PI * 0.9,
        camOffset: new THREE.Vector3(2.5, 2.0, 3.5),
        floorY: 0.0,
        isB1: false
      },
      step4: {
        name: '지하 1층 대본당 (출입문 진입)',
        // 통로 한가운데가 아닌, 출입구 문턱 바로 안쪽에 서서 입장하는 느낌
        charPos: new THREE.Vector3(-5.5, -6.6, -1.5), 
        charRot: Math.PI * 0.85, // 문에서 중앙 통로와 대각선 강단을 향해 비스듬히 바라봄
        camOffset: new THREE.Vector3(2.5, 1.8, 3.0),
        floorY: -6.6,
        isB1: true
      }
    };

    let currentStepKey = 'step1';
    let currentFloorY = 0.0;
    const currentAreaText = document.getElementById('currentAreaText');

    function goToTourStep(stepKey) {
      currentStepKey = stepKey;
      const wp = TOUR_WAYPOINTS[stepKey];
      currentFloorY = wp.floorY;

      document.querySelectorAll('.step-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(stepKey);
      if (activeBtn) activeBtn.classList.add('active');

      currentAreaText.innerText = `현재 위치: ${wp.name}`;

      characterGroup.position.copy(wp.charPos);
      characterGroup.rotation.y = wp.charRot;
      targetPos.copy(wp.charPos);
      isMoving = false;
      isPraying = false;
      hands.visible = false;

      const targetLook = wp.charPos.clone().add(new THREE.Vector3(0, 0.85, 0));
      controls.target.copy(targetLook);
      camera.position.copy(wp.charPos).add(wp.camOffset);

      if (wp.isB1) {
        controls.maxDistance = 16;
      } else {
        controls.maxDistance = 55;
      }
    }

    document.getElementById('step1').addEventListener('click', () => goToTourStep('step1'));
    document.getElementById('step2').addEventListener('click', () => goToTourStep('step2'));
    document.getElementById('step3').addEventListener('click', () => goToTourStep('step3'));
    document.getElementById('step4').addEventListener('click', () => goToTourStep('step4'));

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let isMoving = false;
    const targetPos = new THREE.Vector3().copy(characterGroup.position);
    let targetMarkerTimer = 0;
    let isPraying = false;
    let downTime = 0;
    let downPos = { x: 0, y: 0 };

    window.addEventListener('pointerdown', (e) => {
      downTime = performance.now();
      downPos.x = e.clientX;
      downPos.y = e.clientY;
    });

    window.addEventListener('pointerup', (e) => {
      const diffTime = performance.now() - downTime;
      const dist = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
      if (diffTime > 260 || dist > 6) return;
      if (e.target.closest('#ui-overlay')) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(clickableObjects, true);

      if (intersects.length > 0) {
        let hit = null;
        for (let i = 0; i < intersects.length; i++) {
          const p = intersects[i].point;
          if (currentFloorY < -3.0) {
            if (p.y <= -4.0) { hit = p; break; }
          } else {
            if (p.y >= -1.0) { hit = p; break; }
          }
        }
        if (!hit) {
          hit = intersects[0].point.clone();
          hit.y = currentFloorY;
        }
        targetPos.set(hit.x, currentFloorY, hit.z);
        isMoving = true;
        isPraying = false;
        hands.visible = false;

        targetRing.position.set(hit.x, currentFloorY + 0.03, hit.z);
        targetRing.scale.set(0.1, 0.1, 0.1);
        targetRing.material.opacity = 0.9;
        targetMarkerTimer = 1.0;
      }
    });

    document.getElementById('btnActionPew').addEventListener('click', () => {
      if (currentStepKey !== 'step4') goToTourStep('step4');
      isMoving = false;
      isPraying = true;
      hands.visible = true;
      // 중앙 부채꼴 장의자 착석 위치
      characterGroup.position.set(-6.2, -6.6, -9.5);
      characterGroup.rotation.y = Math.PI * 0.75;
      targetPos.copy(characterGroup.position);
      controls.target.copy(characterGroup.position).add(new THREE.Vector3(0, 0.85, 0));
    });

    const btnPray = document.getElementById('btnActionPray');
    btnPray.addEventListener('click', () => {
      isMoving = false;
      isPraying = !isPraying;
      hands.visible = isPraying;
      if (isPraying) {
        btnPray.innerHTML = '✨ 묵상 중 (일어서기)';
        btnPray.style.background = '#0284c7';
      } else {
        btnPray.innerHTML = '🙏 자리에서 기도';
        btnPray.style.background = 'rgba(30, 41, 59, 0.9)';
      }
    });

    let audioCtx = null;
    let isBgmPlaying = false;
    let audioTimer = null;
    const chords = [[261.63, 329.63, 392.00], [220.00, 261.63, 329.63], [174.61, 220.00, 261.63], [196.00, 246.94, 293.66]];
    let chordIdx = 0;

    function playCalmChord() {
      if (!isBgmPlaying || !audioCtx) return;
      const currentChord = chords[chordIdx % chords.length];
      chordIdx++;
      currentChord.forEach(freq => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.035, audioCtx.currentTime + 1.6);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 5.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 5.6);
      });
      audioTimer = setTimeout(playCalmChord, 4600);
    }

    document.getElementById('bgmToggle').addEventListener('click', () => {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      isBgmPlaying = !isBgmPlaying;
      const btn = document.getElementById('bgmToggle');
      if (isBgmPlaying) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        btn.innerHTML = '<span>🔊 찬양 반주 중 (정지)</span>';
        btn.style.background = '#2563eb';
        playCalmChord();
      } else {
        btn.innerHTML = '<span>🎵 잔잔한 찬양</span>';
        btn.style.background = 'rgba(255,255,255,0.1)';
        clearTimeout(audioTimer);
      }
    });

    const walkSpeed = 3.6;
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (targetMarkerTimer > 0) {
        targetMarkerTimer -= delta * 1.8;
        const scaleVal = 1.0 + (1.0 - targetMarkerTimer) * 0.8;
        targetRing.scale.set(scaleVal, scaleVal, scaleVal);
        targetRing.material.opacity = Math.max(0, targetMarkerTimer);
      }

      if (isMoving) {
        const currentPos = characterGroup.position;
        const dir = new THREE.Vector3().subVectors(targetPos, currentPos);
        dir.y = 0;
        const dist = dir.length();

        if (dist > 0.12) {
          dir.normalize();
          currentPos.addScaledVector(dir, Math.min(dist, walkSpeed * delta));
          const targetRot = Math.atan2(dir.x, dir.z);
          characterGroup.rotation.y = THREE.MathUtils.lerp(characterGroup.rotation.y, targetRot, 0.18);

          const t = clock.getElapsedTime() * 14;
          body.position.y = 0.38 + Math.abs(Math.sin(t)) * 0.05;
          head.position.y = 0.85 + Math.abs(Math.sin(t)) * 0.05;
          characterGroup.rotation.z = Math.sin(t) * 0.05;

          controls.target.lerp(new THREE.Vector3(currentPos.x, currentPos.y + 0.85, currentPos.z), 0.08);
        } else {
          isMoving = false;
          body.position.y = 0.38;
          head.position.y = 0.85;
          characterGroup.rotation.z = 0;
        }
      } else if (isPraying) {
        const breathe = Math.sin(clock.getElapsedTime() * 2.0) * 0.02;
        body.position.y = 0.38 + breathe;
        head.position.y = 0.85 + breathe * 0.5;
        head.rotation.x = 0.25;
      } else {
        body.position.y = 0.38;
        head.position.y = 0.85;
        head.rotation.x = 0;
        characterGroup.rotation.z = 0;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
