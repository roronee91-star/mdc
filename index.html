<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>물댄동산교회 가상 성전 메타버스 투어</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #fff;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 20px;
    }
    .header-bar {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(14px);
      padding: 12px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
    }
    .header-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .header-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .header-sub {
      font-size: 11px;
      color: #94a3b8;
    }
    .tour-steps {
      display: flex;
      gap: 6px;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: 10px;
    }
    .step-btn {
      background: transparent;
      border: none;
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }
    .step-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }
    .step-btn.active {
      background: #2563eb;
      color: #fff;
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.5);
    }
    .bgm-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }
    .bgm-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .bottom-bar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      width: 100%;
    }
    .guide-card {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(14px);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 12px;
      line-height: 1.6;
      color: #cbd5e1;
      max-width: 450px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .guide-card b {
      color: #38bdf8;
    }
    .action-group {
      pointer-events: auto;
      display: flex;
      gap: 8px;
    }
    .action-btn {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 9px 15px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(10px);
      transition: all 0.2s;
    }
    .action-btn:hover {
      background: #3b82f6;
      border-color: #60a5fa;
      transform: translateY(-2px);
    }
    #loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity 0.5s ease;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-text { font-size: 15px; font-weight: 600; color: #e2e8f0; margin-bottom: 6px; }
    #loading-sub { font-size: 12px; color: #64748b; }
  </style>

  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.js"}}</script>
</head>
<body>

  <div id="loading-screen">
    <div class="spinner"></div>
    <div id="loading-text">가상 성전 공간을 준비 중입니다...</div>
    <div id="loading-sub">교회 전경 및 본당 단면 뷰 로딩 중</div>
  </div>

  <div id="canvas-container"></div>

  <div id="ui-overlay">
    <div class="header-bar">
      <div class="header-left">
        <span class="header-title">물댄동산교회 메타버스 성전 투어</span>
        <span class="header-sub" id="currentAreaText">현재 위치: 외관 횡단보도 (출발점)</span>
      </div>

      <div class="tour-steps">
        <button class="step-btn active" id="step1">1. 횡단보도</button>
        <button class="step-btn" id="step2">2. 교회 앞 광장</button>
        <button class="step-btn" id="step3">3. 1층 로비·계단</button>
        <button class="step-btn" id="step4">4. 지하 본당 입구</button>
        <button class="step-btn" id="step5">5. 3층 식당·소그룹실</button>
      </div>

      <div class="header-right">
        <button class="bgm-btn" id="bgmToggle">🎵 잔잔한 찬양</button>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="guide-card">
        <b>[조작 안내]</b><br>
        • <b>바닥 클릭:</b> 원하는 지점을 찍으면 캐릭터가 팔을 흔들며 걸어갑니다.<br>
        • <b>화면 드래그:</b> 마우스 좌클릭으로 360도 회전, 우클릭으로 시점 이동<br>
        • <b>투어 버튼:</b> 횡단보도에서 시작해 본당까지 순서대로 둘러보세요!
      </div>

      <div class="action-group">
        <button class="action-btn" id="btnActionPew">🪑 장의자 착석</button>
        <button class="action-btn" id="btnActionPray">🙏 자리에서 기도</button>
        <button class="action-btn" id="btnActionEat">🍚 식당에서 밥먹기</button>
        <button class="action-btn" id="btnActionGroup">💬 소그룹실 앉기</button>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import {GLTFLoader} from './vendor/three/loaders/GLTFLoader.js';
    import {OrbitControls} from './vendor/three/controls/OrbitControls.js';

    // -------------------------------------------------------------------------
    // 1. 씬, 카메라, 렌더러 초기화
    // -------------------------------------------------------------------------
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xdce7f3);
    scene.fog = new THREE.FogExp2(0xdce7f3, 0.002);

    const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 1000);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 1.2;
    window.__dbg = { camera, controls, scene, get furn() { return furn; }, get b1Seats() { return b1Seats; } }; // 화면 확인(자동 검사)용
    controls.maxDistance = 55;

    // 조명
    const hemiLight = new THREE.HemisphereLight(0xfff7ef, 0x475569, 0.95);
    hemiLight.position.set(0, 50, 0);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfff3e0, 1.4);
    sunLight.position.set(20, 35, 25);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.bias = -0.0004;
    scene.add(sunLight);

    const b1WarmLight = new THREE.PointLight(0xffe2be, 2.8, 35, 0.7);
    b1WarmLight.position.set(-6, -4.0, -8);
    scene.add(b1WarmLight);

    // 야외 지면
    const terrain = new THREE.Mesh(
      new THREE.PlaneGeometry(300, 300),
      new THREE.MeshStandardMaterial({ color: 0xc3ccc0, roughness: 1.0 })
    );
    terrain.rotation.x = -Math.PI / 2;
    terrain.position.y = -0.28;
    terrain.receiveShadow = true;
    scene.add(terrain);

    // 클릭 링 마커
    const targetRing = new THREE.Mesh(
      new THREE.RingGeometry(0.15, 0.45, 32),
      new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide, transparent: true, opacity: 0 })
    );
    targetRing.rotation.x = -Math.PI / 2;
    targetRing.position.y = 0.02;
    scene.add(targetRing);

    // -------------------------------------------------------------------------
    // 2. 디테일 1m 캐릭터 모델링 (헤어, 눈, 볼터치, 어깨, 양팔, 기도 손)
    // -------------------------------------------------------------------------
    const characterGroup = new THREE.Group();

    // 몸통 (단정한 네이비 코트)
    const bodyGeo = new THREE.CylinderGeometry(0.20, 0.28, 0.52, 16);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.5 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.35;
    body.castShadow = true;
    characterGroup.add(body);

    // 머리 그룹 (얼굴 + 헤어 + 이목구비)
    const headGroup = new THREE.Group();
    headGroup.position.y = 0.78;

    const skinMat = new THREE.MeshStandardMaterial({ color: 0xffe0bd, roughness: 0.6 });
    const hairMat = new THREE.MeshStandardMaterial({ color: 0x3b2314, roughness: 0.8 }); // 짙은 갈색 헤어

    // 얼굴 구체
    const faceMesh = new THREE.Mesh(new THREE.SphereGeometry(0.26, 20, 20), skinMat);
    faceMesh.castShadow = true;
    headGroup.add(faceMesh);

    // 단정한 숏컷 헤어 캡
    const hairCap = new THREE.Mesh(new THREE.SphereGeometry(0.27, 20, 20, 0, Math.PI * 2, 0, Math.PI * 0.55), hairMat);
    hairCap.position.y = 0.02;
    headGroup.add(hairCap);

    // 앞머리 볼륨
    const hairBangs = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.09, 0.12), hairMat);
    hairBangs.position.set(0, 0.14, 0.20);
    hairBangs.rotation.x = -0.2;
    headGroup.add(hairBangs);

    // 귀여운 눈 (좌/우)
    const eyeGeo = new THREE.SphereGeometry(0.035, 12, 12);
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0x1e1e24 });
    const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
    leftEye.position.set(-0.09, 0.02, 0.24);
    leftEye.scale.set(1.0, 1.25, 0.3);
    headGroup.add(leftEye);

    const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
    rightEye.position.set(0.09, 0.02, 0.24);
    rightEye.scale.set(1.0, 1.25, 0.3);
    headGroup.add(rightEye);

    // 눈동자 하이라이트 (초롱초롱한 반사광)
    const shineGeo = new THREE.SphereGeometry(0.012, 8, 8);
    const shineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const leftShine = new THREE.Mesh(shineGeo, shineMat);
    leftShine.position.set(-0.08, 0.035, 0.252);
    headGroup.add(leftShine);

    const rightShine = new THREE.Mesh(shineGeo, shineMat);
    rightShine.position.set(0.10, 0.035, 0.252);
    headGroup.add(rightShine);

    // 볼터치 (핑크)
    const blushGeo = new THREE.PlaneGeometry(0.055, 0.03);
    const blushMat = new THREE.MeshBasicMaterial({ color: 0xf472b6, transparent: true, opacity: 0.65 });
    const leftBlush = new THREE.Mesh(blushGeo, blushMat);
    leftBlush.position.set(-0.13, -0.05, 0.23);
    leftBlush.rotation.y = -0.45;
    headGroup.add(leftBlush);

    const rightBlush = new THREE.Mesh(blushGeo, blushMat);
    rightBlush.position.set(0.13, -0.05, 0.23);
    rightBlush.rotation.y = 0.45;
    headGroup.add(rightBlush);

    characterGroup.add(headGroup);

    // 움직이는 양팔 (어깨 관절 기준 회전)
    // 몸보다 살짝 밝은 파란색을 적용하여 팔이 몸에 파묻히지 않게 구분
    const armMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.5 });
    const armGeo = new THREE.CylinderGeometry(0.05, 0.045, 0.40, 12);
    armGeo.translate(0, -0.20, 0); // 어깨 중심으로 피벗 세팅

    // 왼팔 그룹
    const leftArmGroup = new THREE.Group();
    // 몸(radius 0.2) 밖으로 명확하게 돌출되도록 어깨 위치 -0.22 설정
    leftArmGroup.position.set(-0.22, 0.55, 0.0);
    const leftArmMesh = new THREE.Mesh(armGeo, armMat);
    leftArmGroup.add(leftArmMesh);
    const leftHand = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 12), skinMat);
    leftHand.position.set(0, -0.38, 0);
    leftArmGroup.add(leftHand);
    characterGroup.add(leftArmGroup);

    // 오른팔 그룹
    const rightArmGroup = new THREE.Group();
    rightArmGroup.position.set(0.22, 0.55, 0.0);
    const rightArmMesh = new THREE.Mesh(armGeo, armMat);
    rightArmGroup.add(rightArmMesh);
    const rightHand = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 12), skinMat);
    rightHand.position.set(0, -0.38, 0);
    rightArmGroup.add(rightHand);
    characterGroup.add(rightArmGroup);

    // 초기 시작 위치 (외관 횡단보도 위)
    characterGroup.position.set(-1.5, 0.0, 7.5);
    characterGroup.rotation.y = Math.PI;
    scene.add(characterGroup);

    camera.position.set(2.0, 3.2, 13.5);
    controls.target.set(-1.5, 1.0, 7.5);

    // -------------------------------------------------------------------------
    // 3. GLTF 모델 로드 & 스마트 반투명 단면(Cutaway) 처리
    // -------------------------------------------------------------------------
    let loadedModel = null;
    const clickableObjects = [terrain];
    const b1ObstructingMeshes = [];
    const topMeshes = []; // 4층·지붕 (3층 내부를 위에서 볼 때 숨김)
    const outsideMeshes = []; // 본당(B1) 이외의 건물·주변 (본당을 위에서 볼 때 숨김)

    const loader = new GLTFLoader();
    const loadingScreen = document.getElementById('loading-screen');
    const loadingSub = document.getElementById('loading-sub');

    loader.load(
      'church-model-release-20261104.glb',
      (gltf) => {
        loadedModel = gltf.scene;

        loadedModel.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            clickableObjects.push(child);

            // 유리창 투명화
            if (child.name.includes('GLASS') || child.name.includes('Glass')) {
              child.material.transparent = true;
              child.material.opacity = 0.35;
              child.material.depthWrite = false;
            }

            if (child.name.startsWith('F4_') || child.name.startsWith('ROOF')) topMeshes.push(child);
            if (!child.name.startsWith('B1_FINAL')) {
              child.userData.isTop = child.name.startsWith('F4_') || child.name.startsWith('ROOF');
              outsideMeshes.push(child);
            }

            // 본당 시야를 가리는 지상 바닥 슬래브 및 남/동측 외벽 태그 등록
            if (
              child.name.includes('Ceiling') ||
              child.name.includes('ROOF') ||
              child.name.includes('F1_PARKING') ||
              child.name.includes('Wall_South') ||
              child.name.includes('Wall_East') ||
              child.name.includes('Wall_North') ||
              child.name.includes('Wall_West')
            ) {
              child.material = child.material.clone(); // 다른 벽(자모실·방송실)까지 같이 투명해지지 않게 따로 복사
              b1ObstructingMeshes.push(child);
            }
          }
        });

        loadedModel.position.set(0, 0, 0);
        scene.add(loadedModel);
        try { applyB1Fixes(loadedModel); } catch (e) { console.warn('본당 보정 실패', e); }

        loadingScreen.style.opacity = '0';
        setTimeout(() => loadingScreen.style.display = 'none', 400);
      },
      (xhr) => {
        if (xhr.lengthComputable) {
          const percent = Math.round((xhr.loaded / xhr.total) * 100);
          loadingSub.innerText = `모델 데이터 로딩 중... (${percent}%)`;
        }
      },
      (err) => {
        console.warn('기본 씬으로 동작합니다:', err);
        loadingScreen.style.opacity = '0';
        setTimeout(() => loadingScreen.style.display = 'none', 300);
      }
    );

    // ===F3-BEGIN===
    // -------------------------------------------------------------------------
    // 3층 식당 · 주방 · 소그룹실 (도면 평면을 GLB 크기에 맞춰 옮긴 배치)
    //  - 도면 가로(24.85m) → 모델 12.4m (x 0.4986배), 세로 → 모델 17.5m (0.949배)
    //  - 가구 높이/크기는 캐릭터(1m)에 맞춰 절반 크기 (의자 앉는 높이 0.22m)
    // -------------------------------------------------------------------------
    const F3_Y = 7.25;                       // 3층 바닥 윗면 높이
    const planX = (m) => -12.4 + m * 0.4986; // 도면 서쪽 끝에서 잰 거리(m) → 모델 x
    const planZ = (m) => -17.5 + m * 0.949;  // 도면 북쪽 끝에서 잰 거리(m) → 모델 z

    const furn = new THREE.Group();
    const levelLabels = []; // 층별 이름표 (다른 층에서 벽 너머로 비치지 않게 해당 층에서만 보임)
    furn.name = 'F3_FURNITURE';
    scene.add(furn);

    const mat = (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.8 });
    const mWood = mat(0x9a6b3f), mSeat = mat(0xe0c08f), mBack = mat(0xc4975f);
    const mPlate = mat(0xf7f7f7), mSoup = mat(0xc8452d);
    const mWall = mat(0xf1ece4), mCounter = mat(0xe6dfd2), mTop = mat(0xb98a5a), mDark = mat(0x3a3a3a);

    function box(w, h, d, x, y0, z, material) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
      m.position.set(x, F3_Y + y0 + h / 2, z);
      m.castShadow = true;
      m.receiveShadow = true;
      furn.add(m);
      return m;
    }
    function cyl(r, h, x, y0, z, material) {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 16), material);
      m.position.set(x, F3_Y + y0 + h / 2, z);
      m.castShadow = true;
      furn.add(m);
      return m;
    }
    function wallSeg(xa, za, xb, zb, h) {
      const t = 0.08;
      const w = Math.abs(xb - xa) || t;
      const d = Math.abs(zb - za) || t;
      box(w, h || 2.2, d, (xa + xb) / 2, 0, (za + zb) / 2, mWall);
    }
    function chair(x, z, dir) { // dir = +1 이면 동쪽(+x)을 보고 앉는 의자
      box(0.28, 0.04, 0.28, x, 0.18, z, mSeat);          // 앉는 면 (윗면 높이 0.22)
      box(0.05, 0.18, 0.05, x, 0, z, mBack);              // 의자 다리
      box(0.03, 0.26, 0.28, x - dir * 0.125, 0.22, z, mBack); // 등받이
    }
    function table(x, z, len, wid) {
      box(wid, 0.04, len, x, 0.34, z, mWood);             // 윗면 높이 0.38
      [[-1, -1], [-1, 1], [1, -1], [1, 1]].forEach(([sx, sz]) => {
        box(0.04, 0.34, 0.04, x + sx * (wid / 2 - 0.03), 0, z + sz * (len / 2 - 0.05), mWood);
      });
    }

    // ---- 식당: 4열 x 3줄 식탁 (한 식탁에 양쪽 3명씩) ----
    const DINING_COLS = [-7.0, -5.4, -3.8];   // 3열: 열 사이 통로 0.7m 이상

    // 배식대: 주방 벽에 붙여서 (주방 통로 앞)

    wallSeg(-12.4, kitchenS, kitchenE, kitchenS, 2.2);            // 남쪽 벽

    wallSeg(-11.1, wcS, -9.7, wcS, 2.2);
    wallSeg(-8.95, wcS, kitchenE, wcS, 2.2);

    // ---- 소그룹실 1 · 2 · 3 (동쪽) ----
    const roomW = planX(20.25);                                   // 소그룹실 서쪽 벽 x
    // 북동쪽 모서리에 건물 돌기둥(RIGHT_STONE_END_PIER, x -1.04~0.21, z -17.1~-15.1)이 있어
    // 소그룹실 1이 기둥에 반쯤 묻혔다. 기둥 남쪽(z -15.1)부터 세 방을 같은 깊이(약 2.3m)로 다시 나누고,
    // 기둥 옆 좁은 자리는 창고로 막는다.

    wallSeg(roomW, F3_PIER_S, -1.04, F3_PIER_S, 2.2);             // 창고 | 소그룹실 1
    for (let i = 0; i < 3; i++) {
      const za = roomZ[i], zb = roomZ[i + 1];

      const cz = (roomZ[i] + zb) / 2;

      // 식탁 길이 0.9m: 식탁 양 끝에 0.65m 이상 남겨 문 반대편(동쪽) 의자까지 돌아 들어갈 수 있게
      table(GX, cz, 0.9, 0.5);

    label('창고', (roomW - 1.04) / 2, -16.3);
    label('식당', -5.9, planZ(1.0) - 0.3);

    // 3층 실내 조명
    const f3Light = new THREE.PointLight(0xfff0d8, 2.4, 24, 0.8);

    // ===F3-END===

    // ===PEW-BEGIN===
    // 본당 의자 배치: 무대 모서리(-13, -17.5)를 중심으로 부채꼴 줄을 새로 계산
    function layoutPews(opt) {
      const o = Object.assign({
        r0: 8.7, pitch: 1.2, aislesDeg: [30, 58], aisleHalfM: 0.5, offset: 0.75,
        south: -4.0, eastNear: -1.3, eastFar: 0.2
      }, opt || {});
      const C = { x: -13.0, z: -17.5 };
      const HL = 0.55, HW = 0.22, GAP = 0.03;          // 의자 반길이 / 반폭 / 의자 사이 틈
      const out = [];
      const corners = (cx, cz, yaw) => {
        const c = Math.cos(yaw), s = Math.sin(yaw), pts = [];
        [[-HW, -HL], [HW, -HL], [HW, HL], [-HW, HL]].forEach(([lx, lz]) => {
          pts.push([cx + lx * c + lz * s, cz - lx * s + lz * c]);
        });
        return pts;
      };
      const ok = (pts) => pts.every(([x, z]) => {
        if (z > o.south || z < -17.2 || x < -12.7) return false;             // 남쪽 로비 / 북쪽·서쪽 벽
        const eastLimit = (z > -16.6 && z < -10.4) ? o.eastNear : o.eastFar; // 자모실 벽 옆은 더 띄움
        return x <= eastLimit;
      }) && !pts.some(([x, z]) => x > -13.4 && x < -7.0 && z > -17.9 && z < -11.5); // 무대 + 여유
      for (let r = 0; ; r++) {
        const R = o.r0 + r * o.pitch;
        if (R > 19) break;
        const step = (2 * HL + GAP) / R;
        const aisleHalf = Math.asin(o.aisleHalfM / R);
        for (let th = (4 * Math.PI) / 180 + o.offset * step; th < (88 * Math.PI) / 180; th += step) {
          const thc = th + step / 2;
          if (o.aislesDeg.some((a) => Math.abs(thc - (a * Math.PI) / 180) < aisleHalf + step / 2)) continue;
          const cx = C.x + R * Math.cos(thc), cz = C.z + R * Math.sin(thc);
          const yaw = -thc;                                                     // 원래 모델과 같은 방향 규칙
          if (ok(corners(cx, cz, yaw))) out.push({ x: cx, z: cz, yaw, row: r, th: thc });
        }
      }
      return out;
    }
    // ===PEW-END===

    // -------------------------------------------------------------------------
    // 본당(지하 1층) 보정: 의자 새 배치 / 십자가 받침 / LED 화면 / 자모실 / 방송실
    //  ※ GLB 파일은 그대로 두고, 화면이 열릴 때 코드로 고칩니다.
    // -------------------------------------------------------------------------
    let b1Seats = [];
    function pickB1Seat(x, z) {
      let best = null, bd = 1e9;
      b1Seats.forEach((s) => { const d = Math.hypot(s.x - x, s.z - z); if (d < bd) { bd = d; best = s; } });
      return best || { x: x, z: z, y: -6.09, rot: -Math.PI * 0.86 };
    }
    function labelAt(text, x, y, z, sw) {
      const c = document.createElement('canvas');
      c.width = 384; c.height = 96;
      const g = c.getContext('2d');
      g.fillStyle = 'rgba(15,23,42,0.78)';
      if (g.roundRect) { g.beginPath(); g.roundRect(4, 8, 376, 80, 18); g.fill(); } else { g.fillRect(4, 8, 376, 80); }
      g.fillStyle = '#ffffff';
      g.font = 'bold 40px sans-serif';
      g.textAlign = 'center';
      g.textBaseline = 'middle';

      s.scale.set(sw || 2.1, (sw || 2.1) * 0.25, 1);

    function applyB1Fixes(root) {
      const FLOOR = -6.6;
      const byName = {};
      root.traverse((o) => { if (o.isMesh) byName[o.name] = o; });
      const g = new THREE.Group();
      g.name = 'B1_FIXES';
      scene.add(g);
      const hide = (m) => {
        if (!m) return;
        m.visible = false;
        const i = clickableObjects.indexOf(m);
        if (i >= 0) clickableObjects.splice(i, 1);
      };
      const M = (c, extra) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.85 }, extra || {}));
      const wm = M(0xebe6db), gm = M(0xcfe6f2, { transparent: true, opacity: 0.28, roughness: 0.1, depthWrite: false });
      const bx = (x0, x1, y0, y1, z0, z1, material) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), material);
        m.position.set((x0 + x1) / 2, FLOOR + (y0 + y1) / 2, (z0 + z1) / 2);
        m.castShadow = true;
        m.receiveShadow = true;
        g.add(m);
        return m;
      };
      const H = 3.0; // 칸막이 높이

      const fT = byName['B1_FINAL_Pew_Frame_0_0'], pT = byName['B1_FINAL_Pew_Pad_0_0'];
      if (fT && pT) {
        const fy = fT.position.y, py = pT.position.y;
        const frameMesh = fT.clone(), padMesh = pT.clone();
        Object.keys(byName).forEach((k) => {
          if (k.indexOf('B1_FINAL_Pew_Frame_') === 0 || k.indexOf('B1_FINAL_Pew_Pad_') === 0) hide(byName[k]);
        });
        b1Seats = [];
        layoutPews().forEach((p) => {
          const f = frameMesh.clone(); f.visible = true; f.position.set(p.x, fy, p.z); f.rotation.set(0, p.yaw, 0); g.add(f);
          const q = padMesh.clone(); q.visible = true; q.position.set(p.x, py, p.z); q.rotation.set(0, p.yaw, 0); g.add(q);
          [-0.27, 0.27].forEach((t) => {
            const sx = p.x + t * Math.sin(p.yaw), sz = p.z + t * Math.cos(p.yaw);
            b1Seats.push({ x: sx, z: sz, y: py + 0.08, rot: Math.atan2(-13.0 - sx, -17.5 - sz) });
          });
        });
      }

      // 2) 스크린 벽 + LED 화면 (참고 이미지: 스크린 뒤가 벽, 가로로 긴 화면)
      //    무대 모서리를 대각선으로 가로막는 목재 벽을 세우고(모서리에서 각 벽을 따라 4.2m 지점끼리 연결,
      //    폭 약 5.9m · 바닥~천장 6m), 그 벽에 가로 5.3m × 세로 2.4m(약 2.2:1) 스크린을 건다.
      const CORNER = { x: -13.03, z: -17.58 };
      const WALL_S = 4.2, WALL_T = 0.2;
      const LED_W = 5.3, LED_H = 2.4, LED_BOTTOM = -4.7;
      {
        const sc = document.createElement('canvas'); sc.width = 512; sc.height = 256;
        const w = sc.getContext('2d');
        w.fillStyle = '#b4875a'; w.fillRect(0, 0, 512, 256);
        for (let i = 0; i < 512; i += 16) { w.fillStyle = i % 32 ? '#a77b50' : '#c09267'; w.fillRect(i, 0, 14, 256); w.fillStyle = '#7d5a3a'; w.fillRect(i + 14, 0, 2, 256); }
        const wt = new THREE.CanvasTexture(sc);
        if ('colorSpace' in wt) wt.colorSpace = THREE.SRGBColorSpace;
        wt.wrapS = THREE.RepeatWrapping; wt.repeat.set(3, 1);
        const featureWall = new THREE.Mesh(new THREE.BoxGeometry(WALL_S * Math.SQRT2 + 0.3, 6.0, WALL_T),
          new THREE.MeshStandardMaterial({ map: wt, roughness: 0.75 }));
        featureWall.position.set(CORNER.x + WALL_S / 2, FLOOR + 3.0, CORNER.z + WALL_S / 2);
        featureWall.rotation.y = Math.PI / 4;
        featureWall.receiveShadow = true;
        g.add(featureWall);
      }
      const ledOff = WALL_T / 2 + 0.07;                     // 벽 앞면에 붙임
      const led = byName['B1_FINAL_LED_Screen'];
      if (led) {
        led.position.set(CORNER.x + WALL_S / 2 + ledOff * Math.SQRT1_2, LED_BOTTOM + LED_H / 2, CORNER.z + WALL_S / 2 + ledOff * Math.SQRT1_2);
        led.rotation.set(0, Math.PI / 4, 0);
        led.scale.set(LED_W / 5.6, LED_H / 2.3, 1);

        x.fillStyle = sky; x.fillRect(0, 0, 1024, 464);
        [['#8fa6cf', 320, 0.004], ['#6f88b8', 370, 0.006], ['#4d6596', 420, 0.009]].forEach(([col, base, f], i) => {
          x.fillStyle = col; x.beginPath(); x.moveTo(0, 464);
          for (let px = 0; px <= 1024; px += 8) x.lineTo(px, base - 70 * Math.abs(Math.sin(px * f + i * 1.7)) - 30 * Math.sin(px * f * 3.1 + i));

        x.fillStyle = '#ffffff'; x.textAlign = 'center'; x.textBaseline = 'middle';
        x.shadowColor = 'rgba(20,30,60,0.45)'; x.shadowBlur = 12;
        x.font = 'bold 64px sans-serif'; x.fillText('하나님은 사랑이시라', 512, 150);
        x.font = '32px sans-serif'; x.fillText('요한일서 4:8', 512, 222);
        const tex = new THREE.CanvasTexture(c);
        if ('colorSpace' in tex) tex.colorSpace = THREE.SRGBColorSpace;
        // 원래 스크린 상자는 검은 테두리로 두고, 회중 쪽 앞면에 그림 판을 붙임

        face.rotation.set(0, Math.PI / 4, 0);

      // 3) 강대상: 바닥에서 9cm 뜬 것 내려놓기

      if (pulpit) {
        pulpit.position.y -= 0.09;
        // 스크린 벽과 겹치지 않게 대각선으로 앞(회중 쪽)으로 옮김 (모서리에서 대각선 3.8m)
        const d = 3.8 / Math.SQRT2;

      // 4) 십자가: 참고 사진처럼 벽에 붙임. 회중이 무대를 볼 때 스크린 왼쪽 = 서쪽 벽.
      //    스크린 벽 끝(z ≈ -13.4)보다 남쪽에 1.3배 크기로 건다.
      const cv = byName['B1_FINAL_Cross_V'], ch = byName['B1_FINAL_Cross_H'];
      if (cv && ch) {
        const k = 1.3, wallX = CORNER.x + 0.06 * k + 0.02, cz = -12.2;
        const bottom = -5.75, vH = 3.0 * k;
        cv.scale.set(k, k, k); ch.scale.set(k, k, k);
        cv.rotation.set(0, Math.PI / 2, 0); ch.rotation.set(0, Math.PI / 2, 0);   // 앞면이 동쪽(회중)을 향함
        cv.position.set(wallX, bottom + vH / 2, cz);
        ch.position.set(wallX + 0.01, bottom + vH * 0.7, cz);
        // 십자가 뒤 벽을 은은하게 비추는 조명
        const glow = new THREE.PointLight(0xffd9a0, 1.6, 4.5, 1.5);
        glow.position.set(CORNER.x + 0.6, bottom + vH * 0.6, cz);
        g.add(glow);
      }

      // 5) 자모실: 칸막이를 홀 쪽으로 옮겨 방을 넓히고, 유리창 · 문 · 매트 · 아기침대 넣기
      hide(byName['B1_FINAL_Wall_BabyRoom']);
      hide(byName['B1_FINAL_BabyRoom_Glass']);
      {
        const x0 = -0.98, x1 = -0.82;
        bx(x0, x1, 0, H, -16.0, -15.6, wm);
        bx(x0, x1, 0, 0.9, -15.6, -12.3, wm);
        bx(x0, x1, 2.2, H, -15.6, -12.3, wm);
        bx(x0 + 0.05, x1 - 0.05, 0.9, 2.2, -15.6, -12.3, gm);
        bx(x0, x1, 0, H, -12.3, -12.0, wm);
        bx(x0, x1, 2.1, H, -12.0, -11.0, wm);              // 문(-12.0 ~ -11.0) 위
        bx(x0, x1, 0, H, -11.0, -10.95, wm);
        const pink = M(0xf6c6d0), white = M(0xfafafa), wood = M(0xd2b48c);
        bx(-0.78, 0.55, 0, 0.02, -15.8, -11.2, pink);       // 바닥 매트
        [-15.2, -14.3, -13.4].forEach((z) => {              // 아기 침대
          bx(0.05, 0.5, 0.02, 0.28, z - 0.3, z + 0.3, white);
          bx(0.05, 0.5, 0.28, 0.4, z - 0.3, z - 0.27, wood);
          bx(0.05, 0.5, 0.28, 0.4, z + 0.27, z + 0.3, wood);
        });
        [[-0.5, -12.6, 0xe74c3c], [-0.3, -12.3, 0x3498db], [-0.55, -12.0, 0xf1c40f]].forEach(([x, z, c]) => {
          bx(x - 0.07, x + 0.07, 0.02, 0.16, z - 0.07, z + 0.07, M(c));   // 장난감 블록
        });
        bx(-0.7, -0.35, 0, 0.22, -11.7, -11.35, wood);       // 작은 의자
        labelAt('자모실', -0.1, FLOOR + 3.3, -13.5, 1.5);
      }

      // 6) 방송실(엔지니어룸): 벽을 다시 세워 홀 쪽 유리창, 옆 벽, 문, 장비 넣기
      hide(byName['B1_FINAL_Wall_Control']);
      {
        const z0 = -2.12, z1 = -1.88;
        bx(-8.95, -3.45, 0, 1.2, z0, z1, wm);
        bx(-8.95, -3.45, 2.4, H, z0, z1, wm);
        bx(-8.95, -8.4, 1.2, 2.4, z0, z1, wm);
        bx(-4.0, -3.45, 1.2, 2.4, z0, z1, wm);
        bx(-8.4, -4.0, 1.2, 2.4, z0 + 0.05, z1 - 0.05, gm);  // 홀 쪽 유리창
        bx(-9.07, -8.95, 0, H, -1.88, 0.08, wm);              // 서쪽 벽
        bx(-3.57, -3.45, 0, H, -1.88, -1.15, wm);             // 동쪽 벽 (문 -1.15 ~ -0.3)
        bx(-3.57, -3.45, 2.1, H, -1.15, -0.3, wm);
        bx(-3.57, -3.45, 0, H, -0.3, 0.08, wm);
        const dark = M(0x3a3f4a), top = M(0x59606c), screen = M(0x3b82f6, { emissive: 0x1d4ed8, emissiveIntensity: 0.6 });
        bx(-8.0, -4.4, 0, 0.75, -1.7, -1.05, dark);           // 믹싱 데스크
        bx(-8.05, -4.35, 0.75, 0.8, -1.75, -1.0, top);
        for (let i = 0; i < 12; i++) bx(-7.9 + i * 0.29, -7.8 + i * 0.29, 0.8, 0.83, -1.45, -1.2, M(i % 3 === 0 ? 0xef4444 : 0xe5e7eb));
        [-7.4, -6.2, -5.0].forEach((x) => bx(x - 0.28, x + 0.28, 0.85, 1.25, -1.68, -1.62, screen)); // 모니터
        bx(-8.75, -8.2, 0, 1.5, -0.6, -0.1, dark);            // 장비 랙
        bx(-8.15, -7.6, 0, 1.5, -0.6, -0.1, dark);
        bx(-8.65, -8.3, 0.4, 0.46, -0.1, -0.08, screen);
        bx(-6.45, -6.0, 0.2, 0.26, -0.6, -0.15, dark);        // 의자
        bx(-6.45, -6.0, 0.26, 0.7, -0.18, -0.15, dark);
        bx(-6.27, -6.18, 0, 0.2, -0.42, -0.33, dark);
        labelAt('방송실 (엔지니어룸)', -6.2, FLOOR + 3.5, -0.9, 2.8);
      }
    }

    // -------------------------------------------------------------------------
    // 4. 건축 진입 동선 4단계 (스마트 시야 & 카메라 각도 완벽 세팅)
    // -------------------------------------------------------------------------
    const TOUR_WAYPOINTS = {
      step1: {
        name: '외관 횡단보도 (출발점)',
        charPos: new THREE.Vector3(-1.5, 0.0, 7.5),
        charRot: Math.PI,
        camPos: new THREE.Vector3(2.0, 3.2, 13.5),
        camLook: new THREE.Vector3(-1.5, 1.0, 7.5),
        floorY: 0.0,
        isB1: false
      },
      step2: {
        name: '교회 앞 광장 및 필로티',
        charPos: new THREE.Vector3(-1.5, 0.0, 2.0),
        charRot: Math.PI,
        camPos: new THREE.Vector3(2.5, 3.0, 7.5),
        camLook: new THREE.Vector3(-1.5, 1.0, 2.0),
        floorY: 0.0,
        isB1: false
      },
      step3: {
        name: '1층 로비 및 계단실 입구',
        charPos: new THREE.Vector3(-2.8, 0.0, -1.8),
        charRot: Math.PI * 0.9,
        // 벽 뒤에 갇히지 않도록 입구 유리문 앞에서 로비를 들여다보는 하이 앵글
        camPos: new THREE.Vector3(0.5, 2.8, 2.8),
        camLook: new THREE.Vector3(-2.8, 0.85, -1.8),
        floorY: 0.0,
        isB1: false
      },
      step4: {
        name: '지하 1층 대본당 입구 (단면 뷰)',
        // 출입문 바로 안쪽, 중앙 통로와 대각선 강단이 한눈에 보이는 최적 좌표
        charPos: new THREE.Vector3(-5.5, -6.6, -3.3),
        charRot: -Math.PI * 0.86, // 무대(왼쪽 위 모서리)를 향해 바라봄
        // 후면에서 전체 예배당을 내려다보는 웅장한 디오라마 시야각
        // 위에서 비스듬히 내려다보는 시점 (본당 밖 건물은 숨김)
        camPos: new THREE.Vector3(-3.5, 9.5, 8.5),
        camLook: new THREE.Vector3(-6.5, -5.5, -8.5),
        floorY: -6.6,
        isB1: true,
        hideOutside: true
      },
      step5: {
        name: '3층 식당 · 소그룹실',
        charPos: new THREE.Vector3(-6.2, 7.25, -3.0),
        charRot: Math.PI,
        // 4층·지붕을 숨기고 위에서 내려다보는 시점
        camPos: new THREE.Vector3(-6.2, 17.0, 5.5),
        camLook: new THREE.Vector3(-6.2, 7.3, -9.5),
        floorY: 7.25,
        isB1: false,
        hideTop: true
      }
    };

    let currentStepKey = 'step1';
    let currentFloorY = 0.0;
    const currentAreaText = document.getElementById('currentAreaText');

    function goToTourStep(stepKey) {
      currentStepKey = stepKey;
      const wp = TOUR_WAYPOINTS[stepKey];
      currentFloorY = wp.floorY;

      document.querySelectorAll('.step-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(stepKey);
      if (activeBtn) activeBtn.classList.add('active');

      currentAreaText.innerText = `현재 위치: ${wp.name}`;

      characterGroup.position.copy(wp.charPos);
      characterGroup.rotation.y = wp.charRot;
      targetPos.copy(wp.charPos);
      isMoving = false;
      isPraying = false;
      isSitting = false;
      isEating = false;
      outsideMeshes.forEach(m => { m.visible = !(wp.hideOutside || (wp.hideTop && m.userData.isTop)); });
      furn.visible = !wp.hideOutside; // 3층 가구는 본당을 위에서 볼 때 숨김
      levelLabels.forEach(l => { l.visible = l.userData.lv === 'B1' ? !!wp.isB1 : stepKey === 'step5'; });

      // 지하 1층 모드일 때 외벽/천장 반투명 단면 모드 가동
      if (wp.isB1) {
        b1ObstructingMeshes.forEach(mesh => {
          mesh.material.transparent = true;
          mesh.material.opacity = 0.20;
          mesh.material.depthWrite = false;
        });
        terrain.visible = false; // 지면 숨김
        controls.maxDistance = 35;
      } else {
        b1ObstructingMeshes.forEach(mesh => {
          mesh.material.transparent = false;
          mesh.material.opacity = 1.0;
          mesh.material.depthWrite = true;
        });
        terrain.visible = true;
        controls.maxDistance = 55;
      }

      controls.target.copy(wp.camLook);
      camera.position.copy(wp.camPos);
    }

    document.getElementById('step1').addEventListener('click', () => goToTourStep('step1'));
    document.getElementById('step2').addEventListener('click', () => goToTourStep('step2'));
    document.getElementById('step3').addEventListener('click', () => goToTourStep('step3'));
    document.getElementById('step4').addEventListener('click', () => goToTourStep('step4'));
    document.getElementById('step5').addEventListener('click', () => goToTourStep('step5'));

    // -------------------------------------------------------------------------
    // 5. 클릭 투 무브 (Click-to-Move)
    // -------------------------------------------------------------------------
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let isMoving = false;
    let isPraying = false;
    let isSitting = false;
    let isEating = false;
    const targetPos = new THREE.Vector3().copy(characterGroup.position);
    let targetMarkerTimer = 0;
    let downTime = 0;
    let downPos = { x: 0, y: 0 };

    window.addEventListener('pointerdown', (e) => {
      downTime = performance.now();
      downPos.x = e.clientX;
      downPos.y = e.clientY;
    });

    window.addEventListener('pointerup', (e) => {
      const diffTime = performance.now() - downTime;
      const dist = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
      if (diffTime > 260 || dist > 6) return;
      if (e.target.closest('#ui-overlay')) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(clickableObjects, true);

      if (intersects.length > 0) {
        let hit = null;
        for (let i = 0; i < intersects.length; i++) {
          const p = intersects[i].point;
          // 반투명 가림벽은 무시하고 실제 바닥면만 클릭되도록 필터링
          if (currentFloorY < -3.0) {
            if (p.y <= -5.0 && p.y >= -7.0) { hit = p; break; }
          } else if (currentFloorY > 5.0) {
            if (p.y >= 7.0 && p.y <= 7.6) { hit = p; break; }
          } else {
            if (p.y >= -0.5 && p.y <= 0.8) { hit = p; break; }
          }
        }
        if (!hit) {
          hit = intersects[0].point.clone();
          hit.y = currentFloorY;
        }

        targetPos.set(hit.x, currentFloorY, hit.z);
        isMoving = true;
        isPraying = false;
        isSitting = false;
        isEating = false;

        targetRing.position.set(hit.x, currentFloorY + 0.03, hit.z);
        targetRing.scale.set(0.1, 0.1, 0.1);
        targetRing.material.opacity = 0.9;
        targetMarkerTimer = 1.0;
      }
    });

    // -------------------------------------------------------------------------
    // 6. 인터랙션: 장의자 착석 & 경건한 기도 (클리핑 해결)
    // -------------------------------------------------------------------------
    const btnActionPew = document.getElementById('btnActionPew');
    const btnActionPray = document.getElementById('btnActionPray');

    btnActionPew.addEventListener('click', () => {
      if (currentStepKey !== 'step4') goToTourStep('step4');
      isEating = false;
      isMoving = false;
      isSitting = true;
      isPraying = true; // 착석 시 자동으로 기도 포즈

      // 의자 등받이 속이 아니라, 방석 쿠션 상단(높이 -6.38m) 무릎 공간에 정확히 안착
      const seat = pickB1Seat(-6.0, -8.6);
      characterGroup.position.set(seat.x, seat.y, seat.z);
      characterGroup.rotation.y = seat.rot; // 무대(왼쪽 위 모서리)를 향해 앉음
      targetPos.copy(characterGroup.position);

      // 뒤에서 비추되 조금 높게: 커진 스크린과 벽 십자가가 함께 보이게
      controls.target.set(seat.x + Math.sin(seat.rot) * 2.0, seat.y + 1.5, seat.z + Math.cos(seat.rot) * 2.0);
      camera.position.set(seat.x - Math.sin(seat.rot) * 2.6, seat.y + 1.5, seat.z - Math.cos(seat.rot) * 2.6);
    });

    btnActionPray.addEventListener('click', () => {
      isMoving = false;
      isEating = false;
      isPraying = !isPraying;
      if (isPraying) {
        btnActionPray.innerHTML = '✨ 묵상 중 (일어서기)';
        btnActionPray.style.background = '#0284c7';
      } else {
        btnActionPray.innerHTML = '🙏 자리에서 기도';
        btnActionPray.style.background = 'rgba(30, 41, 59, 0.9)';
      }
    });

    // -------------------------------------------------------------------------
    // 3층 버튼: 식당에서 밥먹기 / 소그룹실 앉기
    // -------------------------------------------------------------------------
    function sitAt(x, z, rotY) {
      isMoving = false;
      isPraying = false;
      isSitting = true;
      characterGroup.position.set(x, F3_Y + 0.26, z);
      characterGroup.rotation.y = rotY;
      targetPos.copy(characterGroup.position);
      controls.target.set(x, F3_Y + 0.85, z);
    }

    document.getElementById('btnActionEat').addEventListener('click', () => {
      if (currentStepKey !== 'step5') goToTourStep('step5');
      sitAt(-5.85, DINING_ROWS[1], Math.PI / 2);   // 가운데 열 · 가운데 줄 서쪽 의자, 동쪽을 보고 앉음
      isEating = true;
      camera.position.set(-3.6, F3_Y + 1.7, DINING_ROWS[1] + 2.0);
    });

    document.getElementById('btnActionGroup').addEventListener('click', () => {
      if (currentStepKey !== 'step5') goToTourStep('step5');
      const gz = (roomZ[0] + roomZ[1]) / 2 - 0.23;
      sitAt(-1.55, gz, Math.PI / 2); // 소그룹실 1 서쪽 의자
      // 방 안쪽(동쪽 창가) 위에서 내려다봐 칸막이 벽이 캐릭터를 가리지 않게
      camera.position.set(-0.25, F3_Y + 2.3, gz + 1.3);
    });

    // 찬양 BGM
    let audioCtx = null;
    let isBgmPlaying = false;
    let audioTimer = null;
    const chords = [[261.63, 329.63, 392.00], [220.00, 261.63, 329.63], [174.61, 220.00, 261.63], [196.00, 246.94, 293.66]];
    let chordIdx = 0;

    function playCalmChord() {
      if (!isBgmPlaying || !audioCtx) return;
      const currentChord = chords[chordIdx % chords.length];
      chordIdx++;
      currentChord.forEach(freq => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.035, audioCtx.currentTime + 1.6);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 5.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 5.6);
      });
      audioTimer = setTimeout(playCalmChord, 4600);
    }

    document.getElementById('bgmToggle').addEventListener('click', () => {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      isBgmPlaying = !isBgmPlaying;
      const btn = document.getElementById('bgmToggle');
      if (isBgmPlaying) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        btn.innerHTML = '<span>🔊 찬양 반주 중</span>';
        btn.style.background = '#2563eb';
        playCalmChord();
      } else {
        btn.innerHTML = '<span>🎵 잔잔한 찬양</span>';
        btn.style.background = 'rgba(255,255,255,0.1)';
        clearTimeout(audioTimer);
      }
    });

    // -------------------------------------------------------------------------
    // 7. 메인 루프 (걷기 팔스윙 / 합장 기도 모션 보간)
    // -------------------------------------------------------------------------
    const walkSpeed = 3.6;
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // 클릭 링 마커 펄스
      if (targetMarkerTimer > 0) {
        targetMarkerTimer -= delta * 1.8;
        const scaleVal = 1.0 + (1.0 - targetMarkerTimer) * 0.8;
        targetRing.scale.set(scaleVal, scaleVal, scaleVal);
        targetRing.material.opacity = Math.max(0, targetMarkerTimer);
      }

      // 1. 걷기 상태
      if (isMoving) {
        const currentPos = characterGroup.position;
        const dir = new THREE.Vector3().subVectors(targetPos, currentPos);
        dir.y = 0;
        const dist = dir.length();

        if (dist > 0.12) {
          dir.normalize();
          currentPos.addScaledVector(dir, Math.min(dist, walkSpeed * delta));
          const targetRot = Math.atan2(dir.x, dir.z);
          characterGroup.rotation.y = THREE.MathUtils.lerp(characterGroup.rotation.y, targetRot, 0.18);

          // 걷기 바운스 & 양팔 앞뒤 스윙
          const walkPhase = time * 13;
          body.position.y = 0.35 + Math.abs(Math.sin(walkPhase)) * 0.04;
          headGroup.position.y = 0.78 + Math.abs(Math.sin(walkPhase)) * 0.04;
          headGroup.rotation.x = 0;

          leftArmGroup.rotation.x = Math.sin(walkPhase) * 0.65;
          leftArmGroup.rotation.z = 0.15;
          rightArmGroup.rotation.x = -Math.sin(walkPhase) * 0.65;
          rightArmGroup.rotation.z = -0.15;

          controls.target.lerp(new THREE.Vector3(currentPos.x, currentPos.y + 0.85, currentPos.z), 0.08);
        } else {
          isMoving = false;
        }
      } 
      // 2. 기도 상태 (양팔 합장 + 고개 숙임 + 은은한 호흡)
      else if (isPraying) {
        const breathe = Math.sin(time * 2.2) * 0.015;
        body.position.y = (isSitting ? 0.22 : 0.35) + breathe;
        headGroup.position.y = (isSitting ? 0.65 : 0.78) + breathe * 0.5;

        // 경건하게 고개 숙임
        headGroup.rotation.x = THREE.MathUtils.lerp(headGroup.rotation.x, 0.22, 0.1);

        // 양팔을 앞으로 들고 가슴 중앙에서 두 손을 모아 합장(🙏)
        leftArmGroup.rotation.x = THREE.MathUtils.lerp(leftArmGroup.rotation.x, -0.8, 0.12);
        leftArmGroup.rotation.z = THREE.MathUtils.lerp(leftArmGroup.rotation.z, 0.8, 0.12);
        leftArmGroup.rotation.y = THREE.MathUtils.lerp(leftArmGroup.rotation.y, 0, 0.12);

        rightArmGroup.rotation.x = THREE.MathUtils.lerp(rightArmGroup.rotation.x, -0.8, 0.12);
        rightArmGroup.rotation.z = THREE.MathUtils.lerp(rightArmGroup.rotation.z, -0.8, 0.12);
        rightArmGroup.rotation.y = THREE.MathUtils.lerp(rightArmGroup.rotation.y, 0, 0.12);
      } 
      // 3. 식사 상태 (앉아서 오른팔로 숟가락질)
      else if (isEating) {
        const lift = (Math.sin(time * 2.6) + 1) / 2;
        body.position.y = 0.22;
        headGroup.position.y = 0.65;
        headGroup.rotation.x = 0.12 + lift * 0.1;
        leftArmGroup.rotation.set(-0.5, 0, 0.15);
        rightArmGroup.rotation.set(-0.5 - lift * 0.9, 0, -0.15);
      }
      // 4. 평상시 기본 차렷 자세
      else {
        body.position.y = (isSitting ? 0.22 : 0.35);
        headGroup.position.y = (isSitting ? 0.65 : 0.78);
        headGroup.rotation.x = 0;

        leftArmGroup.rotation.set(0, 0, 0.15);
        rightArmGroup.rotation.set(0, 0, -0.15);
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
