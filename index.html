<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>월림동산교회 가상공간 투어</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #93c5fd; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    
    #ui-overlay {
      position: absolute; top: 16px; left: 16px; z-index: 10;
      background: rgba(15, 23, 42, 0.85); color: #fff; padding: 14px 18px;
      border-radius: 14px; border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .title { font-size: 16px; font-weight: bold; margin-bottom: 4px; }
    .desc { font-size: 12px; color: #cbd5e1; margin-bottom: 10px; }
    .nav-btns { display: flex; gap: 6px; }
    .nav-btns button {
      background: #2563eb; color: #fff; border: none; padding: 7px 13px;
      border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: bold;
      transition: background 0.2s;
    }
    .nav-btns button:hover { background: #1d4ed8; }
    #status-msg { margin-top: 8px; font-size: 11px; color: #38bdf8; }
  </style>

  <!-- 가장 안정적인 cdnjs Three.js 및 로더 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="ui-overlay">
    <div class="title">⛪ 월림동산교회 가상성전</div>
    <div class="desc">PC: <b>W, A, S, D</b> 또는 <b>방향키</b>로 걷기 / 마우스 드래그로 시선 회전</div>
    <div class="nav-btns">
      <button onclick="goTo('plaza')">1. 광장</button>
      <button onclick="goTo('lobby')">2. 로비</button>
      <button onclick="goTo('chapel')">3. 본당</button>
    </div>
    <div id="status-msg">성전 모델 로딩 준비 중...</div>
  </div>

  <div id="canvas-container"></div>

  <script>
    const statusMsg = document.getElementById('status-msg');

    // 1. 씬, 카메라, 렌더러
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x93c5fd);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // 2. 조명
    const hemi = new THREE.HemisphereLight(0xffffff, 0x475569, 1.2);
    scene.add(hemi);

    const dir = new THREE.DirectionalLight(0xfff6e5, 1.4);
    dir.position.set(30, 50, 30);
    scene.add(dir);

    // 3. 광장 바닥
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(160, 160),
      new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.85 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // 4. 가로수 나무들
    function makeTree(x, z) {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.2, 0.25, 2.5, 8),
        new THREE.MeshStandardMaterial({ color: 0x543d2b })
      );
      trunk.position.y = 1.25;
      tree.add(trunk);

      const leaf = new THREE.Mesh(
        new THREE.SphereGeometry(1.2, 8, 8),
        new THREE.MeshStandardMaterial({ color: 0x2e6b38 })
      );
      leaf.position.y = 2.6;
      tree.add(leaf);

      tree.position.set(x, 0, z);
      scene.add(tree);
    }
    const trees = [[-10, 12], [-5, 12], [4, 12], [9, 12], [-14, 5], [14, 5], [-8, 20], [6, 20]];
    trees.forEach(([x, z]) => makeTree(x, z));

    // 5. 캐릭터 (아바타)
    const avatar = new THREE.Group();
    const body = new THREE.Mesh(
      new THREE.CylinderGeometry(0.35, 0.4, 0.9, 16),
      new THREE.MeshStandardMaterial({ color: 0x2563eb })
    );
    body.position.y = 0.45;
    avatar.add(body);

    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.35, 16, 16),
      new THREE.MeshStandardMaterial({ color: 0xffedd5 })
    );
    head.position.y = 1.15;
    avatar.add(head);

    // 시작 위치 (광장)
    avatar.position.set(0, 0, 15);
    scene.add(avatar);

    // 6. 3인칭 카메라 세팅 (캐릭터 등 뒤)
    let camYaw = 0;
    let camPitch = 0.28;
    let camDist = 6.5;
    let isMouseDown = false;
    let px = 0, py = 0;

    window.addEventListener('mousedown', (e) => {
      if (e.target.tagName === 'BUTTON') return;
      isMouseDown = true;
      px = e.clientX;
      py = e.clientY;
    });
    window.addEventListener('mouseup', () => isMouseDown = false);
    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown) return;
      camYaw -= (e.clientX - px) * 0.005;
      camPitch += (e.clientY - py) * 0.004;
      camPitch = Math.max(0.08, Math.min(1.4, camPitch));
      px = e.clientX;
      py = e.clientY;
    });

    // 7. 모델 로더 (Untitled.glb)
    let church = null;
    if (typeof THREE.GLTFLoader !== 'undefined') {
      const loader = new THREE.GLTFLoader();
      loader.load(
        'Untitled.glb',
        (gltf) => {
          church = gltf.scene;
          const toDel = [];
          church.traverse((c) => {
            if (c.name.includes('.001') || c.name === 'Cube') toDel.push(c);
            if (c.isMesh && c.name.includes('GLASS') && c.material) {
              c.material.transparent = true;
              c.material.opacity = 0.45;
              c.material.roughness = 0.1;
              c.material.depthWrite = false;
            }
          });
          toDel.forEach(o => { if (o.parent) o.parent.remove(o); });

          // 모델 바닥 중심 정렬
          const box = new THREE.Box3().setFromObject(church);
          const center = box.getCenter(new THREE.Vector3());
          church.position.x -= center.x;
          church.position.z -= center.z;
          church.position.y -= box.min.y;
          scene.add(church);
          statusMsg.innerText = '성전 로드 완료! 자유롭게 탐방하세요.';
          setTimeout(() => statusMsg.style.display = 'none', 3000);
        },
        (xhr) => {
          if (xhr.lengthComputable) {
            const pct = Math.round((xhr.loaded / xhr.total) * 100);
            statusMsg.innerText = `성전 모델 다운로드 중... (${pct}%)`;
          }
        },
        (err) => {
          statusMsg.innerHTML = '<b style="color:#ef4444;">Untitled.glb 파일을 찾지 못했습니다.</b>';
        }
      );
    } else {
      statusMsg.innerText = '3D 로더 초기화 중...';
    }

    // 8. 텔레포트
    window.goTo = function(loc) {
      if (loc === 'plaza') {
        avatar.position.set(0, 0, 15);
        camYaw = 0; camPitch = 0.28; camDist = 6.5;
      }
      if (loc === 'lobby') {
        avatar.position.set(-4.5, 0.2, 0.5);
        camYaw = Math.PI; camPitch = 0.2; camDist = 4.0;
      }
      if (loc === 'chapel') {
        avatar.position.set(-6.3, -4.2, -4.5);
        camYaw = Math.PI; camPitch = 0.15; camDist = 4.5;
      }
    };

    // 9. 키보드 입력
    const keys = { w: false, a: false, s: false, d: false };
    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') keys.w = true;
      if (k === 's' || k === 'arrowdown') keys.s = true;
      if (k === 'a' || k === 'arrowleft') keys.a = true;
      if (k === 'd' || k === 'arrowright') keys.d = true;
    });
    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') keys.w = false;
      if (k === 's' || k === 'arrowdown') keys.s = false;
      if (k === 'a' || k === 'arrowleft') keys.a = false;
      if (k === 'd' || k === 'arrowright') keys.d = false;
    });

    // 10. 메인 루프 (카메라가 캐릭터 뒤쪽을 바라봄)
    function animate() {
      requestAnimationFrame(animate);

      // 카메라가 바라보는 방향 기준 이동
      const fwd = new THREE.Vector3(-Math.sin(camYaw), 0, -Math.cos(camYaw)).normalize();
      const side = new THREE.Vector3(fwd.z, 0, -fwd.x).normalize();

      const move = new THREE.Vector3();
      if (keys.w) move.add(fwd);
      if (keys.s) move.sub(fwd);
      if (keys.a) move.sub(side);
      if (keys.d) move.add(side);

      if (move.lengthSq() > 0) {
        move.normalize().multiplyScalar(0.14);
        avatar.position.add(move);
        avatar.rotation.y = Math.atan2(move.x, move.z);
      }

      // 카메라가 아바타의 등 뒤를 추적 (target: 캐릭터 중심, camera: 뒤쪽 위)
      const targetPos = avatar.position.clone().add(new THREE.Vector3(0, 1.2, 0));
      camera.position.set(
        targetPos.x + Math.sin(camYaw) * Math.cos(camPitch) * camDist,
        targetPos.y + Math.sin(camPitch) * camDist,
        targetPos.z + Math.cos(camYaw) * Math.cos(camPitch) * camDist
      );
      camera.lookAt(targetPos);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
