<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><title>우리 교회 미리 걷기</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;background:#b9dcf3;color:#273847}canvas{display:block}#hud{position:absolute;inset:0;pointer-events:none}#header{position:absolute;top:20px;left:22px;background:#fffef4ed;padding:15px 19px;border-radius:18px;box-shadow:0 6px 30px #33445522;max-width:310px}#header b{font-size:18px}#header p{font-size:12px;line-height:1.55;margin:6px 0 0;color:#526776}#panel{position:absolute;top:20px;right:20px;display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;max-width:55vw}button{border:0;border-radius:13px;padding:11px 14px;font-weight:700;background:#fffdf5;color:#344d5d;cursor:pointer;box-shadow:0 4px 18px #324e6420}button:hover{background:#e6f8f3}button.active{background:#326f6a;color:white}#bottom{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#fffef4eb;border-radius:16px;padding:12px 18px;font-size:13px;white-space:nowrap;text-align:center;box-shadow:0 6px 30px #33445522}#joystick{display:none;position:absolute;bottom:24px;left:20px;width:118px;height:118px;border:3px solid #ffffff99;border-radius:50%;background:#ffffff55;pointer-events:auto;touch-action:none}#stick{position:absolute;width:48px;height:48px;border-radius:50%;background:#397f79bb;left:32px;top:32px}#welcome{position:absolute;inset:0;background:#183a4a88;display:flex;align-items:center;justify-content:center;pointer-events:auto}#modal{width:min(92vw,430px);padding:30px;background:#fffef9;border-radius:24px;box-shadow:0 20px 80px #19394966;text-align:center}#modal h1{font-size:25px;margin:0 0 8px}#modal p{font-size:14px;line-height:1.7;color:#687987}input{width:100%;border:1px solid #cadbd7;border-radius:12px;padding:14px;font-size:16px;margin:12px 0}#start{width:100%;background:#33796f;color:white;font-size:16px;padding:15px}#toast{position:absolute;left:50%;top:95px;transform:translateX(-50%);background:#203d49e8;color:white;padding:10px 17px;border-radius:20px;opacity:0;transition:opacity .3s;white-space:nowrap}#toast.show{opacity:1}@media(max-width:750px){#header{top:10px;left:10px;padding:10px 12px;max-width:190px}#header b{font-size:14px}#header p{font-size:10px}#panel{right:9px;top:10px;max-width:47vw;gap:5px}button{font-size:11px;padding:9px}#bottom{bottom:10px;font-size:11px;padding:8px;max-width:65vw;white-space:normal}#joystick{display:block}}
</style></head><body><div id="hud"><div id="header"><b>⛪ 우리 교회 미리 걷기</b><p>건축 도면과 외관 이미지를 참고한<br>첫 번째 가상교회 시제품</p></div><div id="panel"><button id="outside" class="active">🌳 교회 외부</button><button id="inside">🕊️ 예배 공간</button><button id="view">🎥 시점 변경</button></div><div id="toast"></div><div id="bottom">⌨️ WASD / 방향키 이동 · 마우스 드래그로 시점 회전 · Shift 달리기</div><div id="joystick"><div id="stick"></div></div><div id="welcome"><div id="modal"><h1>우리 교회에 오신 걸 환영해요!</h1><p>아직 지어지지 않은 교회를<br>귀여운 캐릭터와 함께 미리 산책해 보세요.</p><input id="name" maxlength="16" placeholder="이름 또는 별명" value="방문자"/><button id="start">교회 둘러보기 →</button><p style="font-size:11px">현재는 혼자 탐방하는 시제품이에요.<br>실시간 다른 방문자와 채팅 기능은 다음 단계에서 추가합니다.</p></div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xb6dafa);scene.fog=new THREE.Fog(0xb6dafa,70,165);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,400);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x8ea5a0,2.0));const sun=new THREE.DirectionalLight(0xfff2d7,2.5);sun.position.set(-22,35,20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-65;sun.shadow.camera.right=65;sun.shadow.camera.top=65;sun.shadow.camera.bottom=-65;scene.add(sun);
const mat=(c,rough=.85,metal=0)=>new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:metal});const stone=mat(0xece8de),cream=mat(0xf8f6ee),rib=mat(0xc8d0d1,.4,.3),road=mat(0x7e9099),grass=mat(0x9dbd91),glass=new THREE.MeshPhysicalMaterial({color:0x93d8e3,transparent:true,opacity:.48,roughness:.12,metalness:.15,side:THREE.DoubleSide,depthWrite:false}),frame=mat(0xe8eeeb,.4,.3),wood=mat(0xa9815f),floor=mat(0xded5c6),dark=mat(0x344653);
const world=new THREE.Group();scene.add(world);const insideWorld=new THREE.Group();scene.add(insideWorld);insideWorld.visible=false;
function box(parent,w,h,d,x,y,z,m,shadow=true){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=shadow;o.receiveShadow=true;parent.add(o);return o}function cyl(parent,r1,r2,h,x,y,z,m){const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,9),m);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o}function label(text,w=5){const c=document.createElement('canvas');c.width=512;c.height=128;const ctx=c.getContext('2d');ctx.fillStyle='#ffffffed';ctx.beginPath();ctx.roundRect(5,5,502,118,22);ctx.fill();ctx.fillStyle='#33585a';ctx.font='bold 55px sans-serif';ctx.textAlign='center';ctx.fillText(text,256,82);const t=new THREE.CanvasTexture(c);const p=new THREE.Mesh(new THREE.PlaneGeometry(w,w/4),new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false,side:THREE.DoubleSide}));return p}
// Ground, roads, landscaping
box(world,130,.2,130,0,-.22,0,grass,false);box(world,130,.08,16,0,-.07,29,road,false);box(world,15,.08,130,36,-.06,0,road,false);box(world,40,.08,5,0,-.06,18,mat(0xc7c6bc),false);for(let i=-50;i<55;i+=10){box(world,4,.02,.14,i,.01,29,cream,false);box(world,.14,.02,4,36,.01,i,cream,false)}
// Church massing based on supplied reference: white towers, glazed central wings, vertical fins, open parking base
box(world,30,1.4,18,0,5.3,0,stone);box(world,30,.7,18,0,16.6,0,stone);box(world,28,11.1,16,0,11,0,glass);box(world,1,18,18,-15,9,0,stone);box(world,6,18,6,-12,9,-6,stone);box(world,5,19,6,12.7,9,-6,stone);
// cross tower
box(world,6.5,23,6,3.5,12.5,-8,stone);box(world,.3,5,.28,3.5,18.7,-11.2,rib);box(world,3,.3,.28,3.5,19.6,-11.2,rib);
// vertical architectural fins
for(let x=-5.7;x<1.2;x+=.52)box(world,.18,17.2,1,x,12.1,-9.2,rib);for(let x=7.3;x<12.1;x+=2.2)box(world,.18,11.3,.3,x,11,-8.2,frame);
for(let z=-7;z<8;z+=3.3){box(world,.17,10.6,.17,-7.5,11,z,frame);box(world,.17,10.6,.17,9.4,11,z,frame)}for(let y of [7,11,15]){box(world,29,.15,.2,0,y,8.2,frame);box(world,29,.15,.2,0,y,-8.2,frame)}for(let x=-13;x<14;x+=3.3){box(world,.14,11,.16,x,11,8.2,frame);box(world,.14,11,.16,x,11,-8.2,frame)}
// Open lower-level parking with pillars and low parapet
for(let x of [-13,-5,5,13])for(let z of [-7,7])box(world,.7,5,.7,x,2.5,z,stone);box(world,31,1.1,1,0,5.4,8.6,stone);box(world,31,1.1,1,0,5.4,-8.6,stone);
const sign=label('우리 교회',5);sign.position.set(0,5.5,9.22);world.add(sign);
// Decorative cars
function car(x,z,color){const g=new THREE.Group();world.add(g);g.position.set(x,0,z);box(g,2,.65,3.8,0,.55,0,mat(color));box(g,1.7,.65,2,0,1.12,-.2,glass);for(let xx of [-1,1])for(let zz of [-1.2,1.2]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.37,.37,.18,12),dark);wheel.rotation.z=Math.PI/2;wheel.position.set(xx,.35,zz);g.add(wheel)}}car(-10,1,0xe9e5de);car(-5,1,0xb7c5d4);car(10,1,0xd5d7d5);
function tree(x,z,s=1){const g=new THREE.Group();g.position.set(x,0,z);world.add(g);cyl(g,.23*s,.3*s,3.4*s,0,1.7*s,0,wood);for(const [dx,dy,dz,r] of [[0,4,0,1.8],[-1,3.6,0,1.3],[1,3.7,.5,1.5],[0,3.7,-1,1.4]]){const o=new THREE.Mesh(new THREE.IcosahedronGeometry(r*s,1),mat(0x6c9e79));o.position.set(dx*s,dy*s,dz*s);o.castShadow=true;g.add(o)}}for(let i=0;i<18;i++){const a=i*2.4;tree(Math.cos(a)*24,Math.sin(a)*20,(i%4+7)/10)}
// Interior: an intentionally simplified, indicative worship space
box(insideWorld,36,.3,42,0,-.2,0,floor);box(insideWorld,36,10,.5,0,5,-21,cream);box(insideWorld,.5,10,42,-18,5,0,cream);box(insideWorld,.5,10,42,18,5,0,cream);box(insideWorld,36,.4,42,0,10.2,0,cream);box(insideWorld,17,.8,5,0,.4,-15,wood);box(insideWorld,5,1.1,2,0,1.1,-14,cream);box(insideWorld,.3,5,.3,0,6,-20.5,wood);box(insideWorld,3,.3,.3,0,6.7,-20.5,wood);
for(let side of [-1,1])for(let row=0;row<7;row++){const z=-8+row*3.6;for(let col=0;col<4;col++){const x=side*(3.4+col*2.8);box(insideWorld,2.1,.25,1.2,x,.65,z,wood);box(insideWorld,2.1,1.1,.18,x,1.15,z+.6,wood)}}for(let x of [-17.6,17.6])for(let z=-14;z<16;z+=7){box(insideWorld,.1,5,4,x,5,z,glass,false)}const il=label('예배 공간 · 내부는 시안입니다',8);il.position.set(0,8,-20.6);insideWorld.add(il);
// Avatar
const avatar=new THREE.Group();scene.add(avatar);const skin=mat(0xf2c8a9),shirt=mat(0x5b9d91),pants=mat(0x48596e),hair=mat(0x57463d);cyl(avatar,.48,.62,1.1,0,1.25,0,shirt);cyl(avatar,.37,.37,.65,0,2.1,0,skin);const head=new THREE.Mesh(new THREE.SphereGeometry(.51,18,12),skin);head.position.y=2.5;avatar.add(head);const cap=new THREE.Mesh(new THREE.SphereGeometry(.52,18,12,0,Math.PI*2,0,Math.PI*.45),hair);cap.position.y=2.65;avatar.add(cap);for(let x of [-.24,.24]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.045,8,8),dark);eye.position.set(x,2.55,-.47);avatar.add(eye);box(avatar,.3,.75,.36,x*1.3,.43,0,pants);box(avatar,.3,.9,.32,x*2.8,1.35,0,shirt)}let namePlate=label('방문자',2.4);namePlate.position.y=3.5;avatar.add(namePlate);
let mode='outside',view=0,yaw=0,joyX=0,joyY=0;avatar.position.set(0,0,23);const keys=new Set();addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));let dragging=false,lastX=0;renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX});addEventListener('pointerup',()=>dragging=false);addEventListener('pointermove',e=>{if(dragging){yaw-=(e.clientX-lastX)*.007;lastX=e.clientX}});
const joystick=document.getElementById('joystick'),stick=document.getElementById('stick');joystick.addEventListener('pointerdown',e=>{joystick.setPointerCapture(e.pointerId);moveStick(e)});joystick.addEventListener('pointermove',e=>{if(joystick.hasPointerCapture(e.pointerId))moveStick(e)});function moveStick(e){const r=joystick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.max(1,Math.hypot(dx,dy)),fac=Math.min(1,len/40);joyX=dx/len*fac;joyY=-dy/len*fac;stick.style.transform=`translate(${joyX*36}px,${-joyY*36}px)`}joystick.addEventListener('pointerup',()=>{joyX=joyY=0;stick.style.transform='none'});
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2400)}function switchMode(m){mode=m;world.visible=m==='outside';insideWorld.visible=m==='inside';avatar.position.set(0,0,m==='outside'?23:15);yaw=0;document.getElementById('outside').classList.toggle('active',m==='outside');document.getElementById('inside').classList.toggle('active',m==='inside');toast(m==='outside'?'교회 앞에 도착했어요 🌳':'예배 공간에 들어왔어요 🕊️ (임시 구성)')}
document.getElementById('outside').onclick=()=>switchMode('outside');document.getElementById('inside').onclick=()=>switchMode('inside');document.getElementById('view').onclick=()=>{view=(view+1)%2;toast(view?'가까운 시점':'넓은 시점')};document.getElementById('start').onclick=()=>{const n=document.getElementById('name').value.trim()||'방문자';avatar.remove(namePlate);namePlate.material.map.dispose();namePlate=label(n,Math.max(2.4,n.length*.55));namePlate.position.y=3.5;avatar.add(namePlate);document.getElementById('welcome').style.display='none';toast(`${n}님, 환영합니다!`)};
const clock=new THREE.Clock(),look=new THREE.Vector3();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);let x=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0)+joyX;let z=(keys.has('w')||keys.has('arrowup')?1:0)-(keys.has('s')||keys.has('arrowdown')?1:0)+joyY;const l=Math.hypot(x,z);if(l>.02){x/=Math.max(1,l);z/=Math.max(1,l);const speed=keys.has('shift')?11:6;const dx=(x*Math.cos(yaw)-z*Math.sin(yaw))*dt*speed,dz=(-x*Math.sin(yaw)-z*Math.cos(yaw))*dt*speed;const nx=avatar.position.x+dx,nz=avatar.position.z+dz;if(mode==='outside'){// avoid walking through main building mass
if(!(nx>-16&&nx<16&&nz>-10&&nz<10)){avatar.position.x=THREE.MathUtils.clamp(nx,-58,58);avatar.position.z=THREE.MathUtils.clamp(nz,-58,58)}}else{avatar.position.x=THREE.MathUtils.clamp(nx,-16.5,16.5);avatar.position.z=THREE.MathUtils.clamp(nz,-18.5,19.5)}avatar.rotation.y=Math.atan2(-dx,-dz)}const dist=view?5:10;const target=new THREE.Vector3(avatar.position.x+Math.sin(yaw)*dist,view?4.4:6.5,avatar.position.z+Math.cos(yaw)*dist);camera.position.lerp(target,.09);look.set(avatar.position.x,1.65,avatar.position.z);camera.lookAt(look);namePlate.lookAt(camera.position);renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
