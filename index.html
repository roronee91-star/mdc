<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>월림동산교회 가상공간 투어</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #87ceeb; font-family: sans-serif; }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    
    #ui-overlay {
      position: absolute; top: 16px; left: 16px; z-index: 10;
      background: rgba(15, 23, 42, 0.85); color: #fff; padding: 14px 20px;
      border-radius: 14px; border: 1px solid rgba(255,255,255,0.2);
    }
    .title { font-size: 16px; font-weight: bold; }
    .nav-btns { display: flex; gap: 6px; margin-top: 8px; }
    .nav-btns button {
      background: #2563eb; color: #fff; border: none; padding: 6px 12px;
      border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: bold;
    }
  </style>

  <!-- 가장 호환성 높은 단일 번들 스크립트 로드 -->
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="ui-overlay">
    <div class="title">⛪ 월림동산교회 가상성전</div>
    <div style="font-size: 12px; color: #cbd5e1;">W, A, S, D로 걷기 / 마우스 드래그로 시선 회전</div>
    <div class="nav-btns">
      <button onclick="goTo('plaza')">1. 광장</button>
      <button onclick="goTo('lobby')">2. 로비</button>
      <button onclick="goTo('chapel')">3. 본당</button>
    </div>
  </div>

  <div id="canvas-container"></div>

  <script>
    // 1. 씬 & 하늘색 배경 (절대 까맣게 나오지 않도록 맑은 하늘색 고정)
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x93c5fd);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // 2. 밝은 야외 조명
    const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
    scene.add(hemi);

    const dir = new THREE.DirectionalLight(0xfff5e6, 1.4);
    dir.position.set(20, 40, 20);
    scene.add(dir);

    // 3. 교회 앞마당 바닥
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(150, 150),
      new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.8 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // 4. 가로수 나무 배치
    function makeTree(x, z) {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.2, 0.25, 2.5, 8),
        new THREE.MeshStandardMaterial({ color: 0x5c4033 })
      );
      trunk.position.y = 1.25;
      tree.add(trunk);

      const leaf = new THREE.Mesh(
        new THREE.SphereGeometry(1.2, 8, 8),
        new THREE.MeshStandardMaterial({ color: 0x2e6b38 })
      );
      leaf.position.y = 2.6;
      tree.add(leaf);

      tree.position.set(x, 0, z);
      scene.add(tree);
    }
    const treePos = [[-10, 12], [-5, 12], [4, 12], [9, 12], [-14, 5], [14, 5], [-8, 20], [6, 20]];
    treePos.forEach(([x, z]) => makeTree(x, z));

    // 5. 아바타 캐릭터 (월림이)
    const avatar = new THREE.Group();
    const body = new THREE.Mesh(
      new THREE.CylinderGeometry(0.35, 0.4, 0.9, 16),
      new THREE.MeshStandardMaterial({ color: 0x2563eb })
    );
    body.position.y = 0.45;
    avatar.add(body);

    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.35, 16, 16),
      new THREE.MeshStandardMaterial({ color: 0xffedd5 })
    );
    head.position.y = 1.15;
    avatar.add(head);

    avatar.position.set(0, 0, 15);
    scene.add(avatar);

    // 6. 3인칭 카메라 조작
    let camYaw = 0;
    let camPitch = 0.25;
    let camDist = 7.0;
    let isMouseDown = false;
    let px = 0, py = 0;

    window.addEventListener('mousedown', (e) => {
      if (e.target.tagName === 'BUTTON') return;
      isMouseDown = true;
      px = e.clientX
