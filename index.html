<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>월림동산교회 가상공간 투어</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif; background: #0b0f19; color: #fff; }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    #ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; }
    
    .top-bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: auto; }
    .church-badge {
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px);
      padding: 12px 20px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 12px 36px rgba(0,0,0,0.4);
    }
    .church-title { font-size: 17px; font-weight: 800; color: #f8fafc; letter-spacing: -0.4px; display: flex; align-items: center; gap: 8px; }
    .church-sub { font-size: 12px; color: #94a3b8; margin-top: 3px; }
    .nav-pills { display: flex; gap: 6px; margin-top: 10px; }
    .pill {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
      color: #e2e8f0; font-size: 11px; padding: 5px 10px; border-radius: 20px;
      cursor: pointer; transition: all 0.2s; pointer-events: auto;
    }
    .pill:hover, .pill.active { background: #3b82f6; border-color: #60a5fa; color: #fff; font-weight: 700; }

    .quick-actions { display: flex; gap: 8px; pointer-events: auto; }
    .action-btn {
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15); color: #fff;
      padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; gap: 6px;
      transition: all 0.2s; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .action-btn:hover { background: rgba(30, 41, 59, 0.95); transform: translateY(-1px); }

    .bottom-bar { display: flex; justify-content: space-between; align-items: flex-end; pointer-events: auto; }
    .guide-chip {
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(14px);
      padding: 10px 16px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 12px; color: #cbd5e1; line-height: 1.5; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
