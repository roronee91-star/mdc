<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리교회 가상 성전 투어 (Click-to-Move & B1 Support)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      background-color: #1a1e24;
      color: #fff;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    .header-box {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(14px);
      padding: 14px 22px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: inline-flex;
      align-items: center;
      gap: 16px;
      max-width: fit-content;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }
    .header-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .header-desc {
      font-size: 12px;
      color: #94a3b8;
    }
    .status-badge {
      font-size: 11px;
      background: #0284c7;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 600;
    }
    .floor-controls {
      display: flex;
      gap: 8px;
    }
    .nav-btn {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }
    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.22);
    }
    .nav-btn.active {
      background: #2563eb;
      border-color: #60a5fa;
    }
    .bottom-panel {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      width: 100%;
    }
    .guide-box {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(14px);
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 12px;
      line-height: 1.6;
      color: #cbd5e1;
      max-width: 440px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }
    .guide-box b {
      color: #38bdf8;
    }
    .action-panel {
      pointer-events: auto;
      display: flex;
      gap: 10px;
    }
    .action-btn {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(10px);
      transition: all 0.2s;
    }
    .action-btn:hover {
      background: #3b82f6;
      border-color: #60a5fa;
      transform: translateY(-2px);
    }
    #loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity 0.5s ease;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #loading-text {
      font-size: 15px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 8px;
    }
    #loading-sub {
      font-size: 12px;
      color: #64748b;
    }
    /* 클릭 타겟 링 표시 */
    #click-marker {
      position: absolute;
      width: 24px;
      height: 24px;
      border: 2px solid #38bdf8;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      transition: transform 0.2s ease-out, opacity 0.3s ease-out;
    }
  </style>

  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.js"}}</script>
</head>
<body>

  <div id="loading-screen">
    <div class="spinner"></div>
    <div id="loading-text">가상 성전 공간을 불러오는 중입니다...</div>
    <div id="loading-sub">모델 및 지하 공간 로드 중</div>
  </div>

  <div id="canvas-container"></div>
  <div id="click-marker"></div>

  <div id="ui-overlay">
    <div class="header-box">
      <div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span class="header-title">우리교회 메타버스 성전 투어</span>
          <span class="status-badge">클릭 이동 & 지하 본당 모드</span>
        </div>
        <div class="header-desc">원하는 바닥을 클릭하여 이동하고 지하 본당을 둘러보세요.</div>
      </div>
      <div class="floor-controls">
        <button class="nav-btn" id="btnGoGround">🏢 1층 광장/외관</button>
        <button class="nav-btn active" id="btnGoBasement">⛪ 지하 1층 대본당</button>
      </div>
      <button class="nav-btn" id="bgmToggle">
        <span>🎵 잔잔한 찬양</span>
      </button>
    </div>

    <div class="bottom-panel">
      <div class="guide-box">
        <b>[조작 방식 안내]</b><br>
        • <b>바닥 클릭/터치:</b> 캐릭터가 찍은 지점으로 부드럽게 걸어갑니다.<br>
        • <b>화면 드래그:</b> 시선 및 카메라 각도 회전 (우클릭 드래그로 시점 이동)<br>
        • <b>마우스 휠:</b> 줌 인 / 줌 아웃<br>
        • <b>상단 버튼:</b> 1층 외관과 지하 1층 대본당 간 빠른 순간이동 지원
      </div>

      <div class="action-panel">
        <button class="action-btn" id="btnPray">🙏 자리에서 묵상/기도</button>
        <button class="action-btn" id="btnPewSit">🪑 가까운 장의자 착석</button>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import {GLTFLoader} from './vendor/three/loaders/GLTFLoader.js';
    import {OrbitControls} from './vendor/three/controls/OrbitControls.js';

    // -------------------------------------------------------------
    // 1. 씬, 카메라, 렌더러 초기화
    // -------------------------------------------------------------
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xdce7f3);
    scene.fog = new THREE.FogExp2(0xdce7f3, 0.002);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 1.2;
    controls.maxDistance = 65;
    controls.mouseButtons = {
      LEFT: THREE.MOUSE.ROTATE,
      MIDDLE: THREE.MOUSE.DOLLY,
      RIGHT: THREE.MOUSE.PAN
    };

    // -------------------------------------------------------------
    // 2. 조명 세팅 (야외 태양광 + 지하 앰비언트광)
    // -------------------------------------------------------------
    const hemiLight = new THREE.HemisphereLight(0xfff5e6, 0x475569, 0.9);
    hemiLight.position.set(0, 50, 0);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfff1dc, 1.3);
    sunLight.position.set(20, 35, 25);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 120;
    sunLight.shadow.bias = -0.0004;
    scene.add(sunLight);

    // 지하 본당용 따뜻한 실내 간접 앰비언트 라이트
    const basementLight = new THREE.PointLight(0xffe8c8, 1.8, 40, 0.8);
    basementLight.position.set(-6, -3, 8);
    scene.add(basementLight);

    // -------------------------------------------------------------
    // 3. 지면 및 타겟 마커
    // -------------------------------------------------------------
    const terrain = new THREE.Mesh(
      new THREE.PlaneGeometry(300, 300),
      new THREE.MeshStandardMaterial({ color: 0xc3ccc0, roughness: 1.0 })
    );
    terrain.rotation.x = -Math.PI / 2;
    terrain.position.y = -0.28;
    terrain.receiveShadow = true;
    scene.add(terrain);

    // 3D 클릭 타겟 링 메쉬 (바닥에 펄스 효과)
    const markerGeo = new THREE.RingGeometry(0.15, 0.45, 32);
    const markerMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide, transparent: true, opacity: 0 });
    const targetRing = new THREE.Mesh(markerGeo, markerMat);
    targetRing.rotation.x = -Math.PI / 2;
    targetRing.position.y = -6.58;
    scene.add(targetRing);

    // -------------------------------------------------------------
    // 4. 캐릭터 (1m 2등신 아바타) 모델링
    // -------------------------------------------------------------
    const characterGroup = new THREE.Group();

    // 몸체 (점퍼/코트 스타일)
    const bodyGeo = new THREE.CylinderGeometry(0.24, 0.32, 0.55, 16);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.5 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.38;
    body.castShadow = true;
    characterGroup.add(body);

    // 머리 (2등신 비율: 큼직하고 귀여운 구체)
    const headGeo = new THREE.SphereGeometry(0.30, 20, 20);
    const headMat = new THREE.MeshStandardMaterial({ color: 0xffedd5, roughness: 0.7 });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 0.85;
    head.castShadow = true;
    characterGroup.add(head);

    // 기도 손/아이템용 그룹
    const handsGeo = new THREE.SphereGeometry(0.10, 12, 12);
    const handMat = new THREE.MeshStandardMaterial({ color: 0xffedd5 });
    const hands = new THREE.Mesh(handsGeo, handMat);
    hands.position.set(0, 0.48, 0.22);
    hands.scale.set(1.4, 0.9, 0.9);
    hands.visible = false;
    characterGroup.add(hands);

    // 기본 시작 위치: 지하 본당 중앙 통로 (Z_FLOOR = -6.6)
    const B1_FLOOR_Y = -6.6;
    const G_FLOOR_Y = 0.0;
    let currentFloor = 'B1'; // 'B1' 또는 'G'

    characterGroup.position.set(-2.5, B1_FLOOR_Y, 4.0);
    scene.add(characterGroup);

    // 카메라 초기 위치: 캐릭터 눈높이 맞춤
    camera.position.set(-2.5 + 4, B1_FLOOR_Y + 3.0, 4.0 + 4);
    controls.target.set(characterGroup.position.x, characterGroup.position.y + 0.85, characterGroup.position.z);

    // -------------------------------------------------------------
    // 5. GLTF 모델 로드 & 투명창/지하 컬렉션 정리
    // -------------------------------------------------------------
    const loader = new GLTFLoader();
    const loadingScreen = document.getElementById('loading-screen');
    const loadingSub = document.getElementById('loading-sub');
    let loadedModel = null;
    const clickableObjects = [terrain];

    loader.load(
      'church-model-release-20261104.glb',
      (gltf) => {
        loadedModel = gltf.scene;

        loadedModel.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            clickableObjects.push(child);

            // 유리창 투명화
            if (child.name.includes('GLASS') || child.name.includes('Glass')) {
              child.material.transparent = true;
              child.material.opacity = 0.40;
              child.material.roughness = 0.1;
              child.material.depthWrite = false;
            }

            // 부채꼴 장의자 태그 등록
            if (child.name.includes('Pew') || child.name.includes('PEW')) {
              child.userData.isPew = true;
            }
          }
        });

        loadedModel.position.set(0, 0, 0);
        scene.add(loadedModel);

        loadingScreen.style.opacity = '0';
        setTimeout(() => loadingScreen.style.display = 'none', 450);
      },
      (xhr) => {
        if (xhr.lengthComputable) {
          const percent = Math.round((xhr.loaded / xhr.total) * 100);
          loadingSub.innerText = `성전 모델 및 본당 로딩 중... (${percent}%)`;
        }
      },
      (error) => {
        console.warn('GLB 모델 파일 로드 대기 중 (기본 씬으로 동작합니다).');
        loadingScreen.style.opacity = '0';
        setTimeout(() => loadingScreen.style.display = 'none', 300);
      }
    );

    // -------------------------------------------------------------
    // 6. 클릭-투-무브 (Click to Move) 네비게이션 시스템
    // -------------------------------------------------------------
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let isMoving = false;
    const targetPos = new THREE.Vector3().copy(characterGroup.position);
    let targetMarkerTimer = 0;
    let isSitting = false;
    let isPraying = false;

    let downTime = 0;
    let downPos = { x: 0, y: 0 };

    window.addEventListener('pointerdown', (e) => {
      downTime = performance.now();
      downPos.x = e.clientX;
      downPos.y = e.clientY;
    });

    window.addEventListener('pointerup', (e) => {
      // 단순 클릭(드래그 회전과 구분: 250ms 이내, 이동거리 5px 미만)
      const diffTime = performance.now() - downTime;
      const dist = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
      if (diffTime > 260 || dist > 6) return;

      // UI 요소 클릭은 무시
      if (e.target.closest('#ui-overlay')) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(clickableObjects, true);

      if (intersects.length > 0) {
        // 현재 층에 적합한 바닥 지점 탐색
        let hit = null;
        for (let i = 0; i < intersects.length; i++) {
          const p = intersects[i].point;
          // 지하 1층 모드일 때는 Y가 음수인 지점 우선, 지상 모드일 때는 Y >= -0.5 지점
          if (currentFloor === 'B1') {
            if (p.y <= -2.0) { hit = p; break; }
          } else {
            if (p.y >= -1.0) { hit = p; break; }
          }
        }
        if (!hit) hit = intersects[0].point;

        // 이동 지점 확정
        targetPos.set(hit.x, (currentFloor === 'B1' ? B1_FLOOR_Y : G_FLOOR_Y), hit.z);
        isMoving = true;
        isSitting = false;
        isPraying = false;
        hands.visible = false;

        // 클릭 링 마커 표시
        targetRing.position.set(hit.x, targetPos.y + 0.03, hit.z);
        targetRing.scale.set(0.1, 0.1, 0.1);
        targetRing.material.opacity = 0.9;
        targetMarkerTimer = 1.0;
      }
    });

    // -------------------------------------------------------------
    // 7. 층간 빠른 이동 (1층 외관 <-> 지하 1층 대본당)
    // -------------------------------------------------------------
    const btnGoGround = document.getElementById('btnGoGround');
    const btnGoBasement = document.getElementById('btnGoBasement');

    function switchFloor(floor) {
      currentFloor = floor;
      isMoving = false;
      isSitting = false;
      isPraying = false;
      hands.visible = false;

      if (floor === 'B1') {
        btnGoBasement.classList.add('active');
        btnGoGround.classList.remove('active');
        
        // 지하 1층 본당 뒤편 통로 스폰
        characterGroup.position.set(-2.5, B1_FLOOR_Y, 4.0);
        targetPos.copy(characterGroup.position);
        
        // 강단 모서리 쪽을 올려다보는 카메라
        camera.position.set(-2.5 + 4.5, B1_FLOOR_Y + 2.8, 4.0 + 4.5);
        controls.target.set(-2.5, B1_FLOOR_Y + 0.85, 4.0);
      } else {
        btnGoGround.classList.add('active');
        btnGoBasement.classList.remove('active');

        // 지상 1층 교회 앞 보도 스폰
        characterGroup.position.set(0, G_FLOOR_Y, 9.0);
        targetPos.copy(characterGroup.position);

        camera.position.set(16, 10, 20);
        controls.target.set(0, 0.85, 9.0);
      }
    }

    btnGoGround.addEventListener('click', () => switchFloor('G'));
    btnGoBasement.addEventListener('click', () => switchFloor('B1'));

    // -------------------------------------------------------------
    // 8. 인터랙션 (기도하기 & 장의자 착석)
    // -------------------------------------------------------------
    const btnPray = document.getElementById('btnPray');
    const btnPewSit = document.getElementById('btnPewSit');

    btnPray.addEventListener('click', () => {
      isMoving = false;
      isPraying = !isPraying;
      hands.visible = isPraying;
      if (isPraying) {
        btnPray.innerHTML = '✨ 기도 묵상 중 (일어서기)';
        btnPray.style.background = '#0284c7';
      } else {
        btnPray.innerHTML = '🙏 자리에서 묵상/기도';
        btnPray.style.background = 'rgba(30, 41, 59, 0.85)';
      }
    });

    btnPewSit.addEventListener('click', () => {
      // 지하 본당일 때 가장 가까운 부채꼴 장의자 위치로 자동 이동 후 착석
      if (currentFloor !== 'B1') {
        switchFloor('B1');
      }
      isMoving = false;
      isSitting = true;
      isPraying = true;
      hands.visible = true;
      // 본당 의자 열 중앙 부근 좌석으로 안착
      characterGroup.position.set(-4.8, B1_FLOOR_Y - 0.15, 6.2);
      characterGroup.rotation.y = Math.PI / 4; // 강단 꼭짓점 응시
      targetPos.copy(characterGroup.position);
      controls.target.copy(characterGroup.position).add(new THREE.Vector3(0, 0.85, 0));
    });

    // -------------------------------------------------------------
    // 9. 잔잔한 오르간/피아노 배경 찬양 (Web Audio API)
    // -------------------------------------------------------------
    let audioCtx = null;
    let isBgmPlaying = false;
    let audioTimer = null;
    const chords = [
      [261.63, 329.63, 392.00], // C
      [220.00, 261.63, 329.63], // Am
      [174.61, 220.00, 261.63], // F
      [196.00, 246.94, 293.66]  // G
    ];
    let chordIdx = 0;

    function playCalmChord() {
      if (!isBgmPlaying || !audioCtx) return;
      const currentChord = chords[chordIdx % chords.length];
      chordIdx++;

      currentChord.forEach(freq => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.035, audioCtx.currentTime + 1.6);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 5.5);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 5.6);
      });
      audioTimer = setTimeout(playCalmChord, 4600);
    }

    document.getElementById('bgmToggle').addEventListener('click', () => {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      isBgmPlaying = !isBgmPlaying;
      const btn = document.getElementById('bgmToggle');
      if (isBgmPlaying) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        btn.innerHTML = '<span>🔊 찬양 반주 중 (정지)</span>';
        btn.style.background = '#2563eb';
        playCalmChord();
      } else {
        btn.innerHTML = '<span>🎵 잔잔한 찬양</span>';
        btn.style.background = 'rgba(255,255,255,0.1)';
        clearTimeout(audioTimer);
      }
    });

    // -------------------------------------------------------------
    // 10. 메인 루프 (보행 보간 애니메이션 & 카메라 팔로우)
    // -------------------------------------------------------------
    const walkSpeed = 3.6; // m/s
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      // 클릭 마커 애니메이션 (펄스 페이드아웃)
      if (targetMarkerTimer > 0) {
        targetMarkerTimer -= delta * 1.8;
        const scaleVal = 1.0 + (1.0 - targetMarkerTimer) * 0.8;
        targetRing.scale.set(scaleVal, scaleVal, scaleVal);
        targetRing.material.opacity = Math.max(0, targetMarkerTimer);
      }

      // 캐릭터 이동 처리 (Click to Move)
      if (isMoving) {
        const currentPos = characterGroup.position;
        const dir = new THREE.Vector3().subVectors(targetPos, currentPos);
        dir.y = 0; // 수평 이동만
        const dist = dir.length();

        if (dist > 0.12) {
          dir.normalize();
          const moveStep = walkSpeed * delta;
          currentPos.addScaledVector(dir, Math.min(dist, moveStep));

          // 걷는 방향으로 회전
          const targetRot = Math.atan2(dir.x, dir.z);
          // 부드러운 회전 보간
          characterGroup.rotation.y = THREE.MathUtils.lerp(characterGroup.rotation.y, targetRot, 0.18);

          // 귀여운 2등신 걷기 바운스 모션
          const t = clock.getElapsedTime() * 14;
          body.position.y = 0.38 + Math.abs(Math.sin(t)) * 0.05;
          head.position.y = 0.85 + Math.abs(Math.sin(t)) * 0.05;
          characterGroup.rotation.z = Math.sin(t) * 0.05;

          // 카메라도 캐릭터를 자연스럽게 팔로우
          controls.target.lerp(
            new THREE.Vector3(currentPos.x, currentPos.y + 0.85, currentPos.z),
            0.08
          );
        } else {
          // 목적지 도착
          isMoving = false;
          body.position.y = 0.38;
          head.position.y = 0.85;
          characterGroup.rotation.z = 0;
        }
      } else if (isPraying) {
        // 기도/묵상 시 은은한 호흡 모션
        const breathe = Math.sin(clock.getElapsedTime() * 2.0) * 0.02;
        body.position.y = (isSitting ? 0.22 : 0.38) + breathe;
        head.position.y = (isSitting ? 0.65 : 0.85) + breathe * 0.5;
        head.rotation.x = 0.25; // 살짝 고개 숙임
      } else {
        body.position.y = 0.38;
        head.position.y = 0.85;
        head.rotation.x = 0;
        characterGroup.rotation.z = 0;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
